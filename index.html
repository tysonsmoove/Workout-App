<title>Morning Laps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Compact header + underline tabs; Train = one white sheet of exercise blocks separated by hairlines, with a shallow sticky save bar. */
:root {
  --bg: #EEF0F2;        /* concrete */
  --card: #FFFFFF;
  --fg: #15181C;
  --muted: #5C646E;
  --line: #D9DDE2;
  --soft: #E6E9ED;
  --accent: #C8322B;    /* brick */
  --accent-ink: #FFFFFF;
  --good: #1E8E5A;
  --good-soft: #DCF2E6;
  --warn: #9A6410;
  --warn-soft: #F6ECD4;
  --bad: #B3261E;
  --bad-soft: #F8DAD7;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --nav-h: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101316; --card: #1A1E23; --fg: #F0F2F4; --muted: #A3ABB4; --line: #2C323A; --soft: #242A31;
    --accent: #E04A3F; --accent-ink: #FFFFFF; --good: #3DBB7E; --good-soft: #15352A; --warn: #E0A33A; --warn-soft: #3A2E14; --bad: #F2655C; --bad-soft: #42201D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101316; --card: #1A1E23; --fg: #F0F2F4; --muted: #A3ABB4; --line: #2C323A; --soft: #242A31;
  --accent: #E04A3F; --accent-ink: #FFFFFF; --good: #3DBB7E; --good-soft: #15352A; --warn: #E0A33A; --warn-soft: #3A2E14; --bad: #F2655C; --bad-soft: #42201D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--nav-h) + 12px + env(safe-area-inset-top, 0px)); scroll-padding-bottom: 96px; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: .9375rem; line-height: 1.4; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 16px; }
@media (min-width: 900px) { .wrap { max-width: 640px; } }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
h2 { font-size: 1.375rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
h3 { font-size: 1.0625rem; font-weight: 600; font-family: var(--body); }
.eyebrow { font-family: var(--display); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.tiny { font-size: .8125rem; }
p { margin: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
.meters { display: flex; gap: 12px; }
.meter { text-align: right; }
.meter .k { font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.meter .big { font-family: var(--display); font-size: 1.25rem; font-weight: 700; line-height: 1; }
.pips { display: flex; gap: 2px; justify-content: flex-end; margin-top: 3px; }
.pip { width: 10px; height: 4px; border-radius: 2px; background: var(--soft); }
.pip.on { background: var(--good); }
.pip.lift.on { background: var(--accent); }
nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); height: var(--nav-h); }
nav.tabs a { text-decoration: none; color: var(--muted); font-family: var(--display); font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; text-align: center; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; gap: 12px; padding-top: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.banner { background: var(--warn-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: .875rem; display: grid; gap: 8px; }
.banner.good { background: var(--good-soft); }
.banner.bad { background: var(--bad-soft); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
button { font: inherit; font-family: var(--body); font-weight: 500; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 12px; min-height: 40px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--display); font-size: 1.125rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; flex: 1; min-height: 46px; }
button.primary:disabled { background: var(--soft); color: var(--muted); border-color: var(--soft); opacity: 1; cursor: default; }
button.small { min-height: 32px; padding: 4px 10px; font-size: .8125rem; }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 6px; min-height: 32px; font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }
button.danger { color: var(--bad); border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.seg { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; min-height: 34px; padding: 4px 6px; font-size: .875rem; color: var(--muted); border-radius: 7px; }
.seg button.on { background: var(--fg); color: var(--bg); }
input[type=number], input[type=date], input[type=text], select { font: inherit; font-size: 1.0625rem; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; width: 100%; font-variant-numeric: tabular-nums; }
input[type=number] { text-align: center; -moz-appearance: textfield; }
input::placeholder { color: var(--muted); opacity: .6; }
.logrow input[type=number]:not(:placeholder-shown) { border-color: var(--fg); font-weight: 600; }
label.f { display: grid; gap: 3px; font-size: .6875rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; min-width: 0; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }
/* session heading */
.sess { display: grid; gap: 8px; }
.sess .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sess .head input[type=date] { width: auto; min-height: 36px; padding: 4px 8px; font-size: .875rem; }
.datebar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.datebar button { padding: 4px 0; min-height: 46px; display: grid; gap: 1px; justify-items: center; font-weight: 500; font-size: .6875rem; color: var(--muted); border-color: transparent; background: var(--soft); border-radius: 8px; }
.datebar button b { font-family: var(--display); font-size: 1.0625rem; color: var(--fg); }
.datebar button.sel { border-color: var(--fg); background: var(--card); }
.datebar button .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.datebar button .dot.lift { background: var(--accent); }
.datebar button .dot.part { background: var(--warn); }
.datebar button .dot.cardio { background: var(--good); }
.datebar button .dot.draft { border: 2px solid var(--warn); }
.status { font-size: .8125rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
/* the workout sheet */
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
.blk { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.blk:first-child { border-top: 0; }
.blk .bhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.blk .bhead h3 { flex: 1; min-width: 0; }
.ex { position: relative; }
.exrx { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .875rem; color: var(--muted); }
.exlast { font-size: .875rem; color: var(--muted); }
.exlast b { color: var(--fg); font-weight: 500; }
.exhold { font-size: .8125rem; color: var(--warn); }
.logrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 6px; align-items: end; }
.logrow label.f { letter-spacing: .05em; }
.exprog { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: var(--muted); }
.exprog b { color: var(--fg); font-weight: 500; }
.exdetails { font-size: .8125rem; color: var(--muted); display: grid; gap: 4px; padding: 8px 10px; background: var(--soft); border-radius: 8px; }
.exdetails b { color: var(--fg); font-weight: 500; }
.menubtn { width: 36px; height: 32px; min-height: 32px; padding: 0; border-radius: 8px; font-size: 1.25rem; line-height: 1; letter-spacing: .05em; color: var(--muted); border-color: transparent; background: transparent; flex: none; }
.menubtn[aria-expanded="true"], .menubtn:hover { background: var(--soft); color: var(--fg); }
.menu { position: absolute; right: 0; top: 36px; z-index: 6; min-width: 230px; max-width: calc(100vw - 48px); background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; display: grid; }
.menu .mh { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 4px; font-weight: 600; }
.menu button { border: 0; background: transparent; text-align: left; border-radius: 7px; padding: 10px 10px; min-height: 42px; font-weight: 500; }
.menu button:hover, .menu button:focus-visible { background: var(--soft); outline: none; }
.menu button .sub { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; }
.menu button:disabled { opacity: .5; }
.collapsed-sum { font-size: .875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.collapsed-sum b { color: var(--fg); font-weight: 500; }
details.plain > summary { cursor: pointer; font-weight: 500; font-size: .875rem; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.plain > summary::-webkit-details-marker { display: none; }
details.plain > summary::before { content: "▸"; font-size: .75rem; }
details.plain[open] > summary::before { content: "▾"; }
details.sessopts { padding: 10px 0 2px; border-top: 1px solid var(--line); }
/* save bar */
.savebar { position: sticky; bottom: 0; z-index: 4; background: var(--bg); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; }
.savebar .note { font-size: .8125rem; color: var(--muted); }
.savebar .note.bad { color: var(--bad); font-weight: 500; }
.savebar .note.warn { color: var(--warn); }
.savebar .bar { display: flex; gap: 8px; align-items: center; }
.savebar .st { font-size: .75rem; color: var(--muted); max-width: 40%; line-height: 1.2; }
/* history */
.hist { display: grid; }
details.hi { border-top: 1px solid var(--line); padding: 8px 0; }
details.hi:first-child { border-top: 0; }
details.hi > summary { list-style: none; display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
details.hi > summary::-webkit-details-marker { display: none; }
.hdate { font-family: var(--display); font-weight: 700; font-size: 1.0625rem; line-height: 1; }
.hdate small { display: block; font-family: var(--body); font-weight: 500; font-size: .75rem; color: var(--muted); margin-top: 2px; }
.hbody { padding: 8px 0 4px 0; display: grid; gap: 6px; font-size: .875rem; }
.hbody table, .tbl table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hbody td, .tbl td { padding: 3px 0; border-top: 1px solid var(--line); vertical-align: top; }
.hbody td:last-child, .tbl td:last-child { text-align: right; white-space: nowrap; }
.tbl { overflow-x: auto; }
.plan ul { padding: 0; margin: 0; }
.plan li { list-style: none; display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: .9375rem; }
.plan li:first-child { border-top: 0; }
.sched { display: grid; grid-template-columns: 56px 1fr; gap: 4px 10px; font-size: .9375rem; }
.sched .t { font-family: var(--display); font-weight: 700; font-size: 1.0625rem; }
ul.rules { margin: 6px 0 0 18px; padding: 0; display: grid; gap: 4px; font-size: .8125rem; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; z-index: 20; max-width: calc(100vw - 32px); text-align: center; font-size: .875rem; }
@media (prefers-reduced-motion: no-preference) { button { transition: background .12s, color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="todayLine">Loading</div>
      <h1>Morning Laps</h1>
    </div>
    <div class="meters">
      <div class="meter"><div class="k">Activity</div><div class="big num" id="actCount">0/5</div><div class="pips" id="actPips"></div></div>
      <div class="meter"><div class="k">Lifts</div><div class="big num" id="liftCount">0/3</div><div class="pips" id="liftPips"></div></div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#train" data-tab="train" class="on">Train</a>
    <a href="#program" data-tab="program">Program</a>
    <a href="#history" data-tab="history">History</a>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  'use strict';

  /* ---------- Program ---------- */
  // Equipment confirmed on the Avon Anytime Fitness listing: treadmills, barbells, dumbbells, squat racks,
  // kettlebells, medicine balls, resistance bands, plyo boxes. Selectorized machines and the cable station
  // are standard at Anytime Fitness clubs; every machine move has a dumbbell/barbell fallback via Swap.
  // `per: 'each hand'` marks dumbbell loads: the weight is one dumbbell, not the pair.
  const EX = {
    chestpress:  { name: 'Chest press machine', equip: 'Machine', sets: 3, lo: 8, hi: 12, inc: 5, start: 70, alt: 'dbbench' },
    dbbench:     { name: 'Dumbbell bench press', equip: 'Dumbbells + bench', sets: 3, lo: 8, hi: 12, inc: 5, start: 30, per: 'each hand', alt: 'chestpress' },
    shoulderpress:{ name: 'Shoulder press machine', equip: 'Machine', sets: 3, lo: 8, hi: 12, inc: 5, start: 50, alt: 'dbshoulder' },
    dbshoulder:  { name: 'Seated dumbbell shoulder press', equip: 'Dumbbells + bench', sets: 3, lo: 8, hi: 12, inc: 5, start: 20, per: 'each hand', alt: 'shoulderpress' },
    pushdown:    { name: 'Cable triceps pushdown', equip: 'Cable station', sets: 3, lo: 10, hi: 15, inc: 5, start: 40, alt: 'dbtri' },
    dbtri:       { name: 'Dumbbell overhead triceps extension', equip: 'One dumbbell, both hands', sets: 3, lo: 10, hi: 15, inc: 5, start: 25, alt: 'pushdown' },
    inclinedb:   { name: 'Incline dumbbell press', equip: 'Dumbbells + incline bench', sets: 3, lo: 8, hi: 12, inc: 5, start: 25, per: 'each hand', alt: 'pecdeck' },
    pecdeck:     { name: 'Pec deck / chest fly machine', equip: 'Machine', sets: 3, lo: 10, hi: 15, inc: 5, start: 60, alt: 'inclinedb' },
    latraise:    { name: 'Dumbbell lateral raise', equip: 'Dumbbells', sets: 3, lo: 12, hi: 15, inc: 2.5, start: 10, per: 'each hand', alt: 'cablelat' },
    cablelat:    { name: 'Cable lateral raise', equip: 'Cable station', sets: 3, lo: 12, hi: 15, inc: 2.5, start: 10, alt: 'latraise' },
    latpull:     { name: 'Lat pulldown machine', equip: 'Machine', sets: 3, lo: 8, hi: 12, inc: 5, start: 80, alt: 'assistpull' },
    assistpull:  { name: 'Assisted pull-up machine', equip: 'Machine. Weight = assist; less assist is harder', sets: 3, lo: 8, hi: 12, inc: -5, start: 80, alt: 'latpull' },
    seatedrow:   { name: 'Seated cable row', equip: 'Cable row station', sets: 3, lo: 8, hi: 12, inc: 5, start: 80, alt: 'dbrow' },
    dbrow:       { name: 'One-arm dumbbell row', equip: 'Dumbbell + bench', sets: 3, lo: 8, hi: 12, inc: 5, start: 30, per: 'each hand', alt: 'seatedrow' },
    dbcurl:      { name: 'Dumbbell biceps curl', equip: 'Dumbbells', sets: 3, lo: 10, hi: 12, inc: 2.5, start: 20, per: 'each hand', alt: 'cablecurl' },
    cablecurl:   { name: 'Cable biceps curl', equip: 'Cable station', sets: 3, lo: 10, hi: 12, inc: 5, start: 40, alt: 'dbcurl' },
    hammer:      { name: 'Hammer curl', equip: 'Dumbbells', sets: 3, lo: 10, hi: 12, inc: 2.5, start: 20, per: 'each hand', alt: 'dbcurl' },
    facepull:    { name: 'Cable face pull', equip: 'Cable station + rope', sets: 3, lo: 12, hi: 15, inc: 5, start: 30, alt: 'reardelt' },
    reardelt:    { name: 'Dumbbell rear-delt fly', equip: 'Dumbbells', sets: 3, lo: 12, hi: 15, inc: 2.5, start: 10, per: 'each hand', alt: 'facepull' },
    legpress:    { name: 'Leg press machine', equip: 'Machine', sets: 3, lo: 10, hi: 12, inc: 10, start: 140, alt: 'goblet' },
    goblet:      { name: 'Goblet squat', equip: 'Kettlebell or dumbbell', sets: 3, lo: 10, hi: 12, inc: 5, start: 35, alt: 'legpress' },
    legext:      { name: 'Leg extension machine', equip: 'Machine', sets: 3, lo: 10, hi: 15, inc: 5, start: 70, alt: 'splitsquat' },
    splitsquat:  { name: 'Dumbbell split squat', equip: 'Dumbbells', sets: 3, lo: 10, hi: 12, inc: 5, start: 20, per: 'each hand', alt: 'legext' },
    legcurl:     { name: 'Leg curl machine', equip: 'Machine (seated or lying)', sets: 3, lo: 10, hi: 15, inc: 5, start: 60, alt: 'dbrdl' },
    dbrdl:       { name: 'Dumbbell Romanian deadlift', equip: 'Dumbbells', sets: 3, lo: 10, hi: 12, inc: 5, start: 30, per: 'each hand', alt: 'legcurl' },
    calf:        { name: 'Standing calf raise', equip: 'Calf machine or step + dumbbell', sets: 3, lo: 12, hi: 15, inc: 10, start: 90, alt: 'goblet' },
    squat:       { name: 'Barbell back squat', equip: 'Squat rack', sets: 3, lo: 6, hi: 10, inc: 10, start: 95, alt: 'legpress' },
    lunge:       { name: 'Walking lunges', equip: 'Dumbbells', sets: 3, lo: 10, hi: 12, inc: 5, start: 15, per: 'each hand', alt: 'splitsquat' },
    crunch:      { name: 'Crunches', equip: 'Mat', sets: 3, lo: 15, hi: 20, bw: true },
    legraise:    { name: 'Lying leg raises', equip: 'Mat', sets: 3, lo: 10, hi: 15, bw: true },
    benchtuck:   { name: 'Bench knee tucks', equip: 'Flat bench', sets: 3, lo: 10, hi: 15, bw: true, note: 'Sit on the end of the bench, legs hanging, lean back and pull knees to chest.' }
  };
  const CORE = ['crunch', 'legraise', 'benchtuck'];
  const DAYS = {
    push: { name: 'Push', sub: 'Chest, shoulders, triceps',
      phases: { 1: ['chestpress', 'shoulderpress', 'pushdown'], 2: ['chestpress', 'inclinedb', 'shoulderpress', 'latraise', 'pushdown'], 3: ['inclinedb', 'pecdeck', 'shoulderpress', 'latraise', 'pushdown'] } },
    pull: { name: 'Pull', sub: 'Back, biceps, core',
      phases: { 1: ['latpull', 'seatedrow', 'dbcurl'].concat(CORE), 2: ['latpull', 'seatedrow', 'facepull', 'dbcurl'].concat(CORE), 3: ['latpull', 'seatedrow', 'facepull', 'hammer', 'dbcurl'].concat(CORE) } },
    legs: { name: 'Legs', sub: 'Quads, hamstrings, calves, core',
      phases: { 1: ['legpress', 'legext', 'legcurl'].concat(CORE), 2: ['legpress', 'dbrdl', 'legext', 'legcurl', 'calf'].concat(CORE), 3: ['squat', 'dbrdl', 'lunge', 'legcurl', 'calf'].concat(CORE) } }
  };
  const ROTATION = ['push', 'pull', 'legs'];
  const TREAD_MIN = { 1: 20, 2: 25, 3: 30 };
  const GOAL = 5;
  const LIFT_GOAL = 3;        // lift days per week that complete a week
  const QUALIFY_MIN = 2;      // main (non-core) lifts with a logged set for a day to count as a lift day
  const MAX_SETS = 5;
  const SCHEMA = 2;

  /* ---------- Dates (calendar math in UTC, "today" in Indianapolis) ---------- */
  const TZ = 'America/Indiana/Indianapolis';
  const tzFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  const tzTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const todayIso = () => tzFmt.format(new Date());
  const toUTC = s => { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
  const fromUTC = ms => new Date(ms).toISOString().slice(0, 10);
  const validIso = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && fromUTC(toUTC(s)) === s;
  const addDays = (s, n) => fromUTC(toUTC(s) + n * 86400000);
  const dow = s => new Date(toUTC(s)).getUTCDay();
  const weekStart = s => addDays(s, -((dow(s) + 6) % 7)); // Monday
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const nice = s => { const d = new Date(toUTC(s)); const t = todayIso(); return DOW[d.getUTCDay()] + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCDate() + (s.slice(0, 4) !== t.slice(0, 4) ? ' ' + d.getUTCFullYear() : ''); };
  const rel = s => { const t = todayIso(); return s === t ? 'Today' : s === addDays(t, -1) ? 'Yesterday' : nice(s); };

  /* ---------- State ---------- */
  const state = {
    sessions: {},       // date -> saved record (db or local)
    settings: { startDate: null, maxed: {}, swaps: {}, goal: GOAL },
    drafts: {},         // date -> unsaved form draft (this device only)
    status: {},         // date -> { s: 'saving'|'synced'|'local'|'failed', at, msg }
    formError: {},      // date -> validation message shown after a Save attempt
    details: {},        // exercise key -> details panel open (this visit)
    menu: null,         // { key, view: 'main'|'swap' } while an exercise menu is open
    selDate: todayIso(),
    tab: 'train',
    storage: 'loading', // loading | db | local | nodb
    stale: false,
    localOnly: null,    // dates saved in this browser but not in the account store
    importNote: null,
    confirmRemove: null
  };
  let db = null;
  const writeQ = {};
  function queueWrite(key, fn) { writeQ[key] = (writeQ[key] || Promise.resolve()).then(fn, fn); return writeQ[key]; }
  const lsGet = (k, dflt) => { try { const v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };

  /* ---------- Records: normalize (content decides the kind, never the tab) ---------- */
  const isNum = v => typeof v === 'number' && isFinite(v);
  function normalize(rec) {
    const legacy = !(rec.v >= 2);
    const ex = {};
    Object.keys(rec.ex || {}).forEach(k => {
      if (!EX[k]) return;
      const e = rec.ex[k] || {};
      // Legacy records stored blank sets as 0, so a legacy 0 reads as "not logged". v2 keeps 0 as a failed set.
      const reps = (e.reps || []).map(r => legacy ? (isNum(r) && r > 0 ? r : null) : (isNum(r) ? r : null));
      if (reps.some(r => r != null)) ex[k] = { w: isNum(e.w) ? e.w : null, reps };
    });
    const keys = Object.keys(ex);
    const mainLogged = keys.filter(k => !EX[k].bw).length;
    const tm = rec.treadmill && isNum(rec.treadmill.minutes) ? rec.treadmill : null;
    let kind;
    if (rec.kind === 'rest') kind = 'rest';
    else if (keys.length) kind = 'strength';
    else if (tm && (tm.minutes > 0 || rec.kind === 'cardio')) kind = 'cardio';
    else kind = 'empty';
    const ambiguous = legacy && rec.kind === 'strength' && !keys.length;
    const qualifies = kind === 'strength' && (legacy ? mainLogged >= QUALIFY_MIN : !!rec.qualifies);
    const planned = Array.isArray(rec.planned) ? rec.planned.filter(k => EX[k]) : null;
    const complete = kind !== 'strength' ? null : planned ? planned.every(k => ex[k]) : null;
    return { kind, day: DAYS[rec.day] ? rec.day : null, qualifies, complete, ex, keys, mainLogged, legacy, ambiguous, tm, notes: rec.notes || '', phase: rec.phase || null, planned, plannedBase: rec.plannedBase || null, swaps: rec.swaps || {}, qualifyOverride: rec.qualifyOverride == null ? null : rec.qualifyOverride };
  }
  const records = () => Object.keys(state.sessions).filter(validIso).sort().map(d => Object.assign({ date: d, n: normalize(state.sessions[d]) }, { rec: state.sessions[d] }));

  /* ---------- Derived progress ---------- */
  function startDate() {
    if (state.settings.startDate) return state.settings.startDate;
    const all = Object.keys(state.sessions).sort(); return all[0] || todayIso();
  }
  function liftDays(from, to) { return records().filter(r => r.date >= from && r.date <= to && r.n.qualifies).length; }
  function completedWeeks(asOf) {
    let n = 0; let ws = weekStart(startDate()); const thisWs = weekStart(asOf);
    while (ws < thisWs) { if (liftDays(ws, addDays(ws, 6)) >= LIFT_GOAL) n++; ws = addDays(ws, 7); }
    return n;
  }
  const phaseFor = asOf => Math.min(3, 1 + completedWeeks(asOf));
  function lastLift(beforeDate) { const l = records().filter(r => r.date < beforeDate && r.n.qualifies && r.n.day); return l.length ? l[l.length - 1] : null; }
  function nextDayKey(beforeDate) { const p = lastLift(beforeDate); return p ? ROTATION[(ROTATION.indexOf(p.n.day) + 1) % ROTATION.length] : ROTATION[0]; }
  function weekStats(asOf) {
    const ws = weekStart(asOf), we = addDays(ws, 6);
    const list = records().filter(r => r.date >= ws && r.date <= we);
    return { activity: list.filter(r => r.n.kind === 'strength' || r.n.kind === 'cardio').length, lifts: list.filter(r => r.n.qualifies).length, goal: state.settings.goal || GOAL };
  }
  function lastLog(key, beforeDate) {
    const l = records().filter(r => r.date < beforeDate && r.n.ex[key]);
    return l.length ? Object.assign({ date: l[l.length - 1].date }, l[l.length - 1].n.ex[key]) : null;
  }
  const fmtReps = reps => reps.map(r => r == null ? '–' : r).join(' / ');
  const fmtW = (key, w) => w == null ? '' : w + ' lb' + (EX[key].per ? ' each' : '');
  const stepDown = (ex, w) => Math.max(0, w - ex.inc);
  const stepUp = (ex, w) => Math.max(0, w + ex.inc);

  // Weight rule, as shown on the Program tab. Only logged sets count; blanks are not failures.
  function suggest(key, date) {
    const ex = EX[key]; const last = lastLog(key, date); const maxed = !!(state.settings.maxed || {})[key];
    const logged = last ? last.reps.filter(r => r != null) : [];
    if (ex.bw) {
      if (!last) return { reps: ex.lo, sets: ex.sets, last: null, text: ex.sets + ' × ' + ex.lo, why: 'First time. Work toward ' + ex.hi + ' per set.' };
      const min = Math.min.apply(null, logged);
      const target = min >= ex.hi ? ex.hi + 5 : Math.min(ex.hi, min + 2);
      return { reps: target, sets: ex.sets, last, text: ex.sets + ' × ' + target, why: min >= ex.hi ? 'Every logged set reached ' + ex.hi + '. Push past it.' : 'Lowest logged set was ' + min + '. Add two.' };
    }
    if (!last) return { w: ex.start, sets: ex.sets, last: null, text: ex.start + ' lb' + (ex.per ? ' each hand' : ''), why: 'Starting guess. Adjust until ' + ex.hi + ' clean reps is hard but doable.' };
    const unit = ex.per ? ' lb each hand' : ' lb';
    const allHi = logged.length >= ex.sets && logged.every(r => r >= ex.hi);
    const anyLow = logged.some(r => r < ex.lo);
    if (maxed) {
      const top = Math.max.apply(null, logged);
      const fourth = logged.length >= ex.sets && logged.every(r => r >= ex.hi + 3);
      return { w: last.w, sets: fourth ? ex.sets + 1 : ex.sets, last, text: last.w + unit + (fourth ? ' · add a 4th set' : ' · ' + (top + 1) + ' reps'), why: 'Holding weight. ' + (fourth ? 'Every set is past ' + (ex.hi + 3) + '; add a set.' : 'Beat last time by one rep per set, 3-second lowering.') };
    }
    if (allHi) return { w: stepUp(ex, last.w), sets: ex.sets, last, text: stepUp(ex, last.w) + unit, why: 'All ' + logged.length + ' sets hit ' + ex.hi + '. Up ' + Math.abs(ex.inc) + ' lb.' + (ex.inc < 0 ? ' (Less assist.)' : '') };
    if (anyLow) return { w: stepDown(ex, last.w), sets: ex.sets, last, text: stepDown(ex, last.w) + unit, why: 'A set fell under ' + ex.lo + '. Down one step' + (ex.inc < 0 ? ' (more assist)' : '') + '.' };
    if (logged.length < ex.sets) return { w: last.w, sets: ex.sets, last, text: last.w + unit, why: 'Only ' + logged.length + ' of ' + ex.sets + ' sets logged last time, so no increase. Log all ' + ex.sets + ' at ' + ex.hi + ' to move up.' };
    return { w: last.w, sets: ex.sets, last, text: last.w + unit, why: 'In range but not every set at ' + ex.hi + '. Same weight, chase ' + ex.hi + '.' };
  }

  /* ---------- Drafts (this device, localStorage) ---------- */
  function persistDrafts() {
    const cutoff = addDays(todayIso(), -14);
    Object.keys(state.drafts).forEach(d => { if (d < cutoff) delete state.drafts[d]; });
    lsSet('ml.drafts', state.drafts);
    lsSet('ml.ui', { selDate: state.selDate, today: todayIso() }); // selected date is restored only within the same day
  }
  const emptyDraft = () => ({ kindSel: null, tm: { minutes: '', title: '' }, notes: '', ex: {}, swaps: {}, extra: {}, countAs: null, closed: {}, created: Date.now(), updatedAt: Date.now(), recovered: false, fromRecord: false });
  function seedFromRecord(rec) {
    const d = emptyDraft(); const n = normalize(rec);
    d.fromRecord = true;
    d.kindSel = n.kind === 'strength' ? (n.day || null) : n.kind === 'empty' ? null : n.kind;
    d.tm = { minutes: n.tm ? String(n.tm.minutes) : '', title: n.tm && n.tm.title ? n.tm.title : '' };
    d.notes = n.notes; d.swaps = Object.assign({}, n.swaps); d.countAs = n.qualifyOverride;
    Object.keys(n.ex).forEach(k => { d.ex[k] = { w: n.ex[k].w == null ? '' : String(n.ex[k].w), reps: n.ex[k].reps.map(r => r == null ? '' : String(r)) }; });
    return d;
  }
  function model(date) { // what the form shows
    if (state.drafts[date]) return state.drafts[date];
    const rec = state.sessions[date];
    return rec ? seedFromRecord(rec) : emptyDraft();
  }
  function draft(date) { // create the draft on first edit
    if (!state.drafts[date]) { const rec = state.sessions[date]; state.drafts[date] = rec ? seedFromRecord(rec) : emptyDraft(); }
    state.drafts[date].updatedAt = Date.now();
    return state.drafts[date];
  }
  function draftHasContent(d) {
    return !!(d.tm.minutes !== '' || d.tm.title || d.notes || Object.keys(d.ex).some(k => d.ex[k].w !== '' || d.ex[k].reps.some(r => r !== '')) || d.kindSel);
  }

  /* ---------- Form composition for a date ---------- */
  function kindFor(date, m) {
    if (m.kindSel) return m.kindSel;
    const rec = state.sessions[date];
    if (rec) { const n = normalize(rec); if (n.kind === 'strength' && n.day) return n.day; if (n.kind === 'cardio' || n.kind === 'rest') return n.kind; }
    return nextDayKey(date);
  }
  function phaseOf(date) { const rec = state.sessions[date]; return rec && rec.phase ? rec.phase : phaseFor(date); }
  function plannedFor(date, kind, m) {
    // Returns [{base, key}] in order. An existing record keeps its own planned list; swaps in the draft apply on top.
    const rec = state.sessions[date]; const n = rec ? normalize(rec) : null;
    let bases;
    if (n && n.kind === 'strength' && n.day === kind && n.plannedBase) bases = n.plannedBase.filter(k => EX[k]);
    else if (n && n.kind === 'strength' && n.day === kind && n.legacy) bases = Array.from(new Set((DAYS[kind].phases[phaseOf(date)] || []).concat(n.keys)));
    else bases = DAYS[kind].phases[phaseOf(date)];
    const dflt = n && n.plannedBase ? n.swaps : (state.settings.swaps || {});
    return bases.map(b => {
      let key = m.swaps[b] != null ? m.swaps[b] : (dflt[b] || b);
      if (!EX[key]) key = b;
      return { base: b, key };
    });
  }
  function setCount(key, m, date) {
    const sg = suggest(key, date);
    const have = m.ex[key] ? m.ex[key].reps.length : 0;
    return Math.min(MAX_SETS, Math.max(EX[key].sets, sg.sets || 0, have, m.extra[key] || 0));
  }
  function parseDraft(date, m) {
    // Turns the draft into a record. Returns { doc, errors, summary }.
    const errors = [];
    const kind = kindFor(date, m);
    const phase = phaseOf(date);
    const existing = state.sessions[date];
    const doc = { v: SCHEMA, date, phase, savedAt: existing && existing.savedAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
    if (kind === 'rest') { doc.kind = 'rest'; doc.notes = m.notes.trim(); return { doc, errors, kind: 'rest' }; }
    const min = m.tm.minutes === '' ? null : Number(m.tm.minutes);
    if (min != null && (!isFinite(min) || min < 0 || min !== Math.floor(min))) errors.push('Treadmill minutes must be a whole number, 0 or more.');
    if (min != null || m.tm.title.trim()) doc.treadmill = { minutes: min == null ? 0 : min, title: m.tm.title.trim() };
    doc.notes = m.notes.trim();
    const ex = {}; let plannedPairs = [];
    if (DAYS[kind]) {
      plannedPairs = plannedFor(date, kind, m);
      plannedPairs.forEach(p => {
        const e = m.ex[p.key]; const def = EX[p.key]; if (!e) return;
        const reps = e.reps.map(r => { if (r === '' || r == null) return null; const v = Number(r); return isFinite(v) ? v : NaN; });
        const shown = setCount(p.key, m, date); while (reps.length < shown) reps.push(null); // unentered sets stay unentered
        if (reps.some(r => Number.isNaN(r) || (r != null && (r < 0 || r !== Math.floor(r))))) errors.push(def.name + ': reps must be whole numbers, 0 or more.');
        if (!reps.some(r => r != null)) return;
        if (def.bw) { ex[p.key] = { reps }; return; }
        if (e.w === '') { errors.push(def.name + ': enter the weight you used' + (def.per ? ' (per hand)' : '') + '.'); return; }
        const w = Number(e.w);
        if (!isFinite(w) || w < 0) { errors.push(def.name + ': weight must be 0 or more.'); return; }
        ex[p.key] = { w, reps };
      });
    }
    const keys = Object.keys(ex);
    if (keys.length) {
      const mainLogged = keys.filter(k => !EX[k].bw).length;
      const auto = mainLogged >= QUALIFY_MIN;
      doc.kind = 'strength'; doc.day = kind; doc.ex = ex;
      doc.planned = plannedPairs.map(p => p.key); doc.plannedBase = plannedPairs.map(p => p.base);
      doc.swaps = {}; plannedPairs.forEach(p => { if (p.key !== p.base) doc.swaps[p.base] = p.key; });
      doc.qualifyOverride = m.countAs; doc.qualifies = m.countAs == null ? auto : !!m.countAs;
      doc.complete = doc.planned.every(k => ex[k]);
      return { doc, errors, kind: 'strength', mainLogged, auto };
    }
    if (doc.treadmill && doc.treadmill.minutes > 0) { doc.kind = 'cardio'; return { doc, errors, kind: 'cardio', fromLift: !!DAYS[kind], liftKind: kind }; }
    const empty = errors.length === 0; // a validation error is not "nothing to save": keep Save tappable so the message shows
    errors.push(DAYS[kind] ? 'Nothing to save yet. Log at least one set, or treadmill minutes.' : 'Enter treadmill minutes to save.');
    return { doc, errors, kind: 'none', empty };
  }

  /* ---------- Storage ---------- */
  function localLoad() { state.sessions = lsGet('ml.sessions', {}); const st = lsGet('ml.settings', null); if (st) state.settings = Object.assign(state.settings, st); }
  function localSave() { lsSet('ml.sessions', state.sessions); lsSet('ml.settings', state.settings); }
  function setStatus(date, s, msg) { state.status[date] = { s, at: Date.now(), msg: msg || '' }; }
  async function saveRecord(date, doc) {
    state.sessions[date] = doc; setStatus(date, 'saving'); render();
    if (db) {
      try { await queueWrite('s/' + date, () => db.doc('sessions/' + date).set(doc)); delete state.drafts[date]; setStatus(date, 'synced'); }
      catch (e) { setStatus(date, 'failed', (e && e.code) || 'error'); state.drafts[date] = state.drafts[date] || seedFromRecord(doc); }
    } else { localSave(); delete state.drafts[date]; setStatus(date, 'local'); }
    persistDrafts(); render();
  }
  async function removeRecord(date) {
    const had = state.sessions[date]; delete state.sessions[date]; delete state.drafts[date]; state.confirmRemove = null; persistDrafts(); render();
    if (db) { try { await queueWrite('s/' + date, () => db.doc('sessions/' + date).delete()); toast('Removed ' + nice(date)); } catch (e) { state.sessions[date] = had; toast('Could not remove ' + nice(date) + '. Try again.'); render(); } }
    else { localSave(); toast('Removed ' + nice(date)); }
  }
  async function saveSettings(patch) {
    state.settings = Object.assign({}, state.settings, patch); render();
    if (db) { try { await queueWrite('settings', () => db.doc('settings/program').set(state.settings)); } catch (e) { toast('Could not save settings'); } }
    else localSave();
  }
  async function importLocal() {
    const local = lsGet('ml.sessions', {}); const dates = Object.keys(local).filter(validIso).sort();
    const imported = [], kept = [];
    for (const d of dates) {
      if (state.sessions[d]) { kept.push(d); continue; }
      try { await queueWrite('s/' + d, () => db.doc('sessions/' + d).set(local[d])); state.sessions[d] = local[d]; imported.push(d); } catch (e) { toast('Import stopped at ' + nice(d)); break; }
    }
    imported.forEach(d => delete local[d]); lsSet('ml.sessions', local);
    state.localOnly = Object.keys(local).filter(d => !state.sessions[d]);
    state.importNote = imported.length + ' imported to your account.' + (kept.length ? ' Kept the account copy for ' + kept.map(nice).join(', ') + '; the browser copy was not imported.' : '');
    render();
  }
  async function connect() {
    state.drafts = lsGet('ml.drafts', {}); Object.values(state.drafts).forEach(d => { d.recovered = true; });
    const ui = lsGet('ml.ui', null); if (ui && ui.today === todayIso() && validIso(ui.selDate) && ui.selDate <= todayIso()) state.selDate = ui.selDate;
    let resolved = false;
    const timer = setTimeout(() => { if (!resolved) { state.stale = true; render(); } }, 10000);
    db = await (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
    if (db) { // a signed-in visitor who can only view the owner's log gets browser-only saving instead of failing writes
      try { const user = await window.claude.use('user'); if (user && (await user.can('data.write')) === false) db = null; } catch (e) { /* keep db */ }
    }
    if (!db) { state.storage = 'local'; localLoad(); clearTimeout(timer); render(); return; }
    let gotS = false, gotP = false;
    const done = () => {
      if (gotS && gotP && !resolved) {
        resolved = true; clearTimeout(timer); state.stale = false; state.storage = 'db';
        const local = lsGet('ml.sessions', {}); const only = Object.keys(local).filter(validIso).filter(d => !state.sessions[d]);
        state.localOnly = only.length ? only : null; render();
      }
    };
    db.collection('sessions').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); state.sessions = m;
      if (!snap.metadata.fromCache) gotS = true; done(); render();
    }, () => { state.storage = 'nodb'; clearTimeout(timer); render(); });
    db.doc('settings/program').onSnapshot(snap => {
      if (snap.exists) state.settings = Object.assign({ maxed: {}, swaps: {}, goal: GOAL }, snap.data());
      if (!snap.metadata.fromCache) gotP = true; done(); render();
    }, () => { gotP = true; done(); });
  }

  /* ---------- Render ---------- */
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let toastT;
  function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms || 2200); }
  let typing = false, pendingRender = false;
  function render(focusSel) {
    if (typing) { pendingRender = true; return; }
    const t = todayIso();
    $('#todayLine').textContent = nice(t) + ' · Avon Anytime Fitness';
    const ws = weekStats(t);
    $('#actCount').textContent = ws.activity + '/' + ws.goal;
    $('#actPips').innerHTML = Array.from({ length: ws.goal }, (_, i) => '<span class="pip' + (i < ws.activity ? ' on' : '') + '"></span>').join('');
    $('#liftCount').textContent = ws.lifts + '/' + LIFT_GOAL;
    $('#liftPips').innerHTML = Array.from({ length: LIFT_GOAL }, (_, i) => '<span class="pip lift' + (i < ws.lifts ? ' on' : '') + '"></span>').join('');
    document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === state.tab));
    let html = '';
    if (state.storage === 'local') html += '<div class="banner">Saving in this browser only. Nothing here syncs to your account until you open the page signed in to claude.ai.</div>';
    if (state.storage === 'nodb') html += '<div class="banner bad">Your account log can\'t be reached right now. Saves may fail; your inputs stay on this phone as drafts.</div>';
    if (state.stale) html += '<div class="banner">Still loading your log. What you see may be out of date.</div>';
    if (state.localOnly && state.localOnly.length) html += '<div class="banner"><span>' + state.localOnly.length + ' entr' + (state.localOnly.length === 1 ? 'y' : 'ies') + ' saved in this browser (' + state.localOnly.map(nice).join(', ') + ') ' + (state.localOnly.length === 1 ? 'is' : 'are') + ' not in your account.</span><div class="row"><button type="button" class="small" id="importBtn">Import to account</button><button type="button" class="small" id="importDismiss">Not now</button></div></div>';
    if (state.importNote) html += '<div class="banner good"><span>' + esc(state.importNote) + '</span><div class="row"><button type="button" class="small" id="importOk">OK</button></div></div>';
    html += state.tab === 'train' ? renderTrain() : state.tab === 'program' ? renderProgram() : renderHistory();
    const y = window.scrollY;
    $('#main').innerHTML = html;
    bind();
    if (focusSel) { const el = $(focusSel); if (el) el.focus({ preventScroll: true }); }
    if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y);
  }

  function dotClass(date) {
    const rec = state.sessions[date]; const d = state.drafts[date];
    let c = '';
    if (rec) { const n = normalize(rec); c = n.qualifies ? 'lift' : n.kind === 'strength' ? 'part' : n.kind === 'cardio' ? 'cardio' : ''; }
    if (d && draftHasContent(d)) c += ' draft';
    return c;
  }
  function renderDatebar() {
    const t = todayIso(); let out = '<div class="datebar" aria-label="Last 7 days">';
    for (let i = 6; i >= 0; i--) {
      const d = addDays(t, -i);
      out += '<button type="button" data-date="' + d + '" class="' + (d === state.selDate ? 'sel' : '') + '" aria-label="' + nice(d) + '" aria-pressed="' + (d === state.selDate) + '"><span>' + DOW[dow(d)] + '</span><b>' + Number(d.slice(8)) + '</b><span class="dot ' + dotClass(d) + '"></span></button>';
    }
    return out + '</div>';
  }
  function statusText(date) {
    const rec = state.sessions[date]; const d = state.drafts[date]; const st = state.status[date];
    if (st && st.s === 'saving') return 'Saving…';
    if (st && st.s === 'failed') return 'Save failed · inputs kept';
    const hasDraft = d && draftHasContent(d);
    if (rec && st && st.s === 'synced') return 'Saved · synced' + (hasDraft ? ' · unsaved changes' : '');
    if (rec && st && st.s === 'local') return 'Saved in this browser' + (hasDraft ? ' · unsaved changes' : '');
    if (rec) return 'Saved' + (hasDraft ? ' · unsaved changes' : '');
    if (hasDraft) return (d.recovered ? 'Recovered draft' : 'Draft') + ' · on this phone';

          const e = n.ex[k]; const base = n.plannedBase && n.planned ? n.plannedBase[n.planned.indexOf(k)] : null;
          return '<tr><td>' + esc(EX[k].name) + (base && base !== k ? '<br><span class="tiny muted">instead of ' + esc(EX[base].name) + '</span>' : '') + '</td><td>' + esc((e.w != null ? fmtW(k, e.w) + ' × ' : '') + fmtReps(e.reps)) + '</td></tr>';
        }).join('') + '</table></div>';
        if (n.planned) { const skipped = n.planned.filter(k => !n.ex[k]); if (skipped.length) h += '<p class="tiny muted">Not logged: ' + skipped.map(k => EX[k].name).join(', ') + '.</p>'; }
        if (n.qualifyOverride != null) h += '<p class="tiny muted">Lift credit set by hand: ' + (n.qualifyOverride ? 'counted' : 'not counted') + '.</p>';
      }
      if (n.notes) h += '<p>“' + esc(n.notes) + '”</p>';
      h += '<div class="row"><button type="button" class="small" data-edit="' + r.date + '">Edit ' + nice(r.date) + '</button><button type="button" class="small ' + (state.confirmRemove === r.date ? 'danger' : '') + '" data-remove="' + r.date + '">' + (state.confirmRemove === r.date ? 'Tap again to remove ' + nice(r.date) : 'Remove') + '</button></div>';
      h += '</div></details>';
    });
    h += '</div></section>';

    // Exercise history
    const used = Object.keys(EX).filter(k => records().some(r => r.n.ex[k]));
    h += '<section class="card"><h3>By exercise</h3>';
    if (!used.length) h += '<p class="muted tiny" style="margin-top:6px">Appears once a lift is saved.</p>';
    else {
      const sel = used.includes(state.exHist) ? state.exHist : used[0];
      h += '<select id="exHist" style="margin-top:8px">' + used.map(k => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + esc(EX[k].name) + '</option>').join('') + '</select>';
      const rows = records().filter(r => r.n.ex[sel]).reverse();
      h += '<div class="tbl" style="margin-top:8px"><table>' + rows.map(r => '<tr><td>' + nice(r.date) + '</td><td>' + esc((r.n.ex[sel].w != null ? fmtW(sel, r.n.ex[sel].w) + ' × ' : '') + fmtReps(r.n.ex[sel].reps)) + '</td></tr>').join('') + '</table></div>';
      h += '<p class="tiny muted" style="margin-top:6px">Target ' + EX[sel].sets + ' × ' + EX[sel].lo + '–' + EX[sel].hi + (EX[sel].per ? '. Weight is per hand.' : '.') + '</p>';
    }
    h += '</section>';
    return h;
  }

  /* ---------- Live (no re-render) updates while typing ---------- */
  function refreshLive(date) {
    const m = model(date);
    const sl = $('#statusLine'); if (sl) sl.textContent = statusText(date);
    const sb = $('#savebar'); if (sb) { const tmp = document.createElement('div'); tmp.innerHTML = renderSaveBar(date, m, state.sessions[date]); sb.replaceWith(tmp.firstElementChild); bindSaveBar(); }
    document.querySelectorAll('.ex[data-ex]').forEach(el => {
      const key = el.dataset.ex; const ex = EX[key]; const e = m.ex[key] || { w: '', reps: [] };
      const nSets = el.querySelectorAll('[data-field="rep"]').length || setCount(key, m, date);
      const sum = exSummary(key, e, nSets);
      const prog = el.querySelector('[data-prog]');
      if (prog) { prog.hidden = !sum.loggedN; prog.innerHTML = '<span><b>' + sum.loggedN + '/' + nSets + '</b> sets logged</span>' + (sum.done ? '<button type="button" class="quiet" data-collapse="' + key + '">Collapse</button>' : ''); const cb = prog.querySelector('[data-collapse]'); if (cb) cb.addEventListener('click', onCollapse); }
      const use = el.querySelector('[data-usew]'); if (use) use.hidden = ex.bw || String(e.w) === String(use.dataset.val);
      const cs = el.querySelector('[data-sum]'); if (cs) cs.innerHTML = sum.line ? '<b>' + esc(sum.line) + '</b> · ' + sum.loggedN + '/' + nSets + ' logged' : 'Nothing logged';
    });
    document.querySelectorAll('.datebar [data-date]').forEach(b => { const dot = b.querySelector('.dot'); if (dot) dot.className = 'dot ' + dotClass(b.dataset.date); });
    const ca = $('#countAs'); if (ca && m.countAs == null) { const r = parseDraft(date, m); ca.checked = r.kind === 'strength' ? r.auto : false; }
  }

  /* ---------- Events ---------- */
  const main = $('#main');
  main.addEventListener('input', e => {
    const el = e.target; const f = el.dataset.field; if (!f) return;
    const date = state.selDate; const d = draft(date);
    if (f === 'tmMin') d.tm.minutes = el.value;
    else if (f === 'tmTitle') d.tm.title = el.value;
    else if (f === 'notes') d.notes = el.value;
    else if (f === 'w' || f === 'rep') {
      const key = el.dataset.ex; d.ex[key] = d.ex[key] || { w: '', reps: [] };
      if (f === 'w') d.ex[key].w = el.value;
      else { const i = Number(el.dataset.i); while (d.ex[key].reps.length <= i) d.ex[key].reps.push(''); d.ex[key].reps[i] = el.value; }
    }
    d.recovered = false; delete state.formError[date]; persistDrafts(); refreshLive(date);
  });
  main.addEventListener('focusin', e => { if (e.target.matches('input[data-field]')) typing = true; });
  main.addEventListener('focusout', e => { if (e.target.matches('input[data-field]')) { typing = false; if (pendingRender) { pendingRender = false; render(); } } });
  // exercise menus: close on outside tap or Escape; arrow keys move between items
  document.addEventListener('click', e => { if (state.menu && !e.target.closest('.menu') && !e.target.closest('.menubtn')) { const k = state.menu.key; state.menu = null; render('[data-menu="' + k + '"]'); } });
  document.addEventListener('keydown', e => {
    if (!state.menu) return;
    const items = Array.from(document.querySelectorAll('.menu [role="menuitem"]:not(:disabled)'));
    if (e.key === 'Escape') { const k = state.menu.key; state.menu = null; render('[data-menu="' + k + '"]'); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const i = items.indexOf(document.activeElement); const n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length; if (items[n]) items[n].focus(); e.preventDefault(); }
  });
  function onCollapse(ev) { const key = ev.currentTarget.dataset.collapse; const d = draft(state.selDate); d.closed[key] = true; persistDrafts(); render('[data-menu="' + key + '"]'); }

  function menuAction(act, b) {
    const key = b.dataset.key; const date = state.selDate;
    if (act === 'swap') { state.menu = { key, view: 'swap' }; render('.menu [role="menuitem"]'); return; }
    if (act === 'back') { state.menu = { key, view: 'main' }; render('.menu [role="menuitem"]'); return; }
    if (act === 'swapto') { const d = draft(date); d.swaps[b.dataset.base] = b.dataset.to; d.recovered = false; state.menu = null; persistDrafts(); render('[data-menu="' + b.dataset.to + '"]'); return; }
    if (act === 'hold') { const mx = Object.assign({}, state.settings.maxed || {}); if (mx[key]) delete mx[key]; else mx[key] = true; state.menu = null; saveSettings({ maxed: mx }); const btn = document.querySelector('[data-menu="' + key + '"]'); if (btn) btn.focus({ preventScroll: true }); return; }
    if (act === 'addset') { const d = draft(date); const cur = document.querySelectorAll('[data-field="rep"][data-ex="' + key + '"]').length; d.extra[key] = Math.min(MAX_SETS, cur + 1); state.menu = null; persistDrafts(); render(); const inp = document.getElementById('r-' + key + '-' + (d.extra[key] - 1)); if (inp) inp.focus({ preventScroll: true }); return; }
    if (act === 'details') { state.details[key] = !state.details[key]; state.menu = null; render('[data-menu="' + key + '"]'); return; }
    if (act === 'collapse') { const d = draft(date); d.closed[key] = true; state.menu = null; persistDrafts(); render('[data-menu="' + key + '"]'); return; }
    if (act === 'expand') { const d = draft(date); delete d.closed[key]; state.menu = null; persistDrafts(); render('[data-menu="' + key + '"]'); return; }
  }

  function bind() {
    const dp = $('#datePick'); if (dp) dp.addEventListener('change', e => { const v = e.target.value; if (validIso(v) && v <= todayIso()) { state.selDate = v; state.confirmRemove = null; state.menu = null; persistDrafts(); render(); } else if (v) toast('Pick today or an earlier day. Future workouts live on the Program tab.'); });
    document.querySelectorAll('[data-date]').forEach(b => b.addEventListener('click', () => { state.selDate = b.dataset.date; state.confirmRemove = null; state.menu = null; persistDrafts(); render(); }));
    document.querySelectorAll('#kindSeg [data-kind]').forEach(b => b.addEventListener('click', () => { const d = draft(state.selDate); d.kindSel = b.dataset.kind; d.recovered = false; state.menu = null; persistDrafts(); render(); }));
    document.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const key = b.dataset.menu; if (state.menu && state.menu.key === key) { state.menu = null; render('[data-menu="' + key + '"]'); } else { state.menu = { key, view: 'main' }; render('.menu [role="menuitem"]'); } }));
    document.querySelectorAll('.menu [data-act]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); menuAction(b.dataset.act, b); }));
    document.querySelectorAll('[data-gswap]').forEach(b => b.addEventListener('click', () => { const sw = Object.assign({}, state.settings.swaps || {}); if (b.dataset.to === b.dataset.gswap) delete sw[b.dataset.gswap]; else sw[b.dataset.gswap] = b.dataset.to; saveSettings({ swaps: sw }); }));
    document.querySelectorAll('[data-usew]').forEach(b => b.addEventListener('click', () => { const key = b.dataset.usew; const d = draft(state.selDate); d.ex[key] = d.ex[key] || { w: '', reps: [] }; d.ex[key].w = b.dataset.val; const inp = document.getElementById('w-' + key); if (inp) inp.value = b.dataset.val; d.recovered = false; persistDrafts(); refreshLive(state.selDate); const first = document.getElementById('r-' + key + '-0'); if (first && first.value === '') first.focus({ preventScroll: true }); }));
    document.querySelectorAll('[data-collapse]').forEach(b => b.addEventListener('click', onCollapse));
    document.querySelectorAll('[data-expand]').forEach(b => b.addEventListener('click', () => { const key = b.dataset.expand; const d = draft(state.selDate); delete d.closed[key]; persistDrafts(); render('[data-menu="' + key + '"]'); }));
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => { state.selDate = b.dataset.edit; state.confirmRemove = null; persistDrafts(); location.hash = 'train'; if (state.tab === 'train') render(); }));
    document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => { const d = b.dataset.remove; if (state.confirmRemove === d) removeRecord(d); else { state.confirmRemove = d; render(); const det = document.querySelector('details[data-hdate="' + d + '"]'); if (det) det.open = true; } }));
    bindSaveBar();
    const goal = $('#goalIn'); if (goal) goal.addEventListener('change', e => { const v = Math.max(3, Math.min(7, Number(e.target.value) || GOAL)); saveSettings({ goal: v }); });
    const form = $('#logForm'); if (form) form.addEventListener('submit', e => { e.preventDefault(); save(); });
    const ca = $('#countAs'); if (ca) ca.addEventListener('change', () => { const d = draft(state.selDate); d.countAs = ca.checked; persistDrafts(); refreshLive(state.selDate); });
    const dd = $('#discardDraft'); if (dd) dd.addEventListener('click', () => { delete state.drafts[state.selDate]; delete state.formError[state.selDate]; persistDrafts(); render(); toast('Draft discarded'); });
    const eh = $('#exHist'); if (eh) eh.addEventListener('change', e => { state.exHist = e.target.value; render(); });
    const ib = $('#importBtn'); if (ib) ib.addEventListener('click', importLocal);
    const idm = $('#importDismiss'); if (idm) idm.addEventListener('click', () => { state.localOnly = null; render(); });
    const iok = $('#importOk'); if (iok) iok.addEventListener('click', () => { state.importNote = null; render(); });
  }
  function bindSaveBar() {
    const sb = $('#saveBtn'); if (sb) sb.addEventListener('click', save);
    const del = $('#delBtn'); if (del) del.addEventListener('click', () => { if (state.confirmRemove === state.selDate) removeRecord(state.selDate); else { state.confirmRemove = state.selDate; refreshLive(state.selDate); } });
  }
  function save() {
    const date = state.selDate;
    if (date > todayIso()) { toast('Future dates can\'t be saved as activity.'); return; }
    const m = model(date); const r = parseDraft(date, m);
    if (r.errors.length) {
      state.formError[date] = r.errors[0]; refreshLive(date); toast(r.errors[0], 3200);
      const k = Object.keys(EX).find(k => r.errors[0].startsWith(EX[k].name)); const inp = k ? document.getElementById('w-' + k) : null; if (inp) inp.focus(); return;
    }
    delete state.formError[date]; state.menu = null;
    const note = saveNote(date, m);
    saveRecord(date, r.doc).then(() => {
      const st = state.status[date];
      if (st && st.s === 'failed') toast('Save failed. Your inputs are kept; tap Retry.', 3200);
      else toast((r.kind === 'cardio' && r.fromLift ? r.doc.treadmill.minutes + ' treadmill minutes saved. No lifting sets recorded; ' + DAYS[nextDayKey(date)].name + ' remains next.' : r.kind === 'strength' ? (note ? note.text : DAYS[r.doc.day].name + ' day saved · counts as lift day · next: ' + DAYS[ROTATION[(ROTATION.indexOf(r.doc.day) + 1) % 3]].name) : r.kind === 'rest' ? 'Rest day saved.' : 'Treadmill saved.') + (st && st.s === 'synced' ? ' Synced.' : st && st.s === 'local' ? ' Saved in this browser.' : ''), 3600);
    });
    if (!state.settings.startDate) saveSettings({ startDate: date < todayIso() ? date : todayIso() });
  }

  function route() {
    const h = (location.hash || '#train').slice(1);
    state.tab = ['train', 'program', 'history'].includes(h) ? h : 'train';
    state.confirmRemove = null; state.menu = null; render();
  }
  window.addEventListener('hashchange', route);
  route();
  connect();
})();
</script>
