<title>Morning Laps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Header with profile chip, a slim weekly strip, four underline tabs.
   Every color derives from six numbers a profile's look sets on :root (accent hue/saturation/lightness, neutral hue/saturation). */
:root {
  --ah: 3; --as: 65%; --al: 47%; --ald: 57%;      /* accent: brick by default */
  --nh: 212; --ns: 12%; --nsd: 12%;               /* neutrals lean toward this hue */
  --dk: 0;
  --bg: hsl(var(--nh) var(--ns) 94%);
  --card: #FFFFFF;
  --fg: hsl(var(--nh) 14% 10%);
  --muted: hsl(var(--nh) 9% 39%);
  --line: hsl(var(--nh) 13% 87%);
  --soft: hsl(var(--nh) 15% 91%);
  --accent: hsl(var(--ah) var(--as) var(--al));
  --accent-soft: hsl(var(--ah) var(--as) 95%);
  --accent-ink: var(--aink, #FFFFFF);
  --good: #1E8E5A; --good-soft: #DCF2E6;
  --warn: #9A6410; --warn-soft: #F6ECD4;
  --bad: #B3261E; --bad-soft: #F8DAD7;
  --water: #1C7BB8; --water-soft: #DCEEF9;
  --gold: #B8860B;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --caps: uppercase; --track: .02em;
  --r: 12px;
  --nav-h: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --dk: 1;
    --bg: hsl(var(--nh) var(--nsd) 7%); --card: hsl(var(--nh) var(--nsd) 12%); --fg: hsl(var(--nh) 10% 95%); --muted: hsl(var(--nh) 8% 67%);
    --line: hsl(var(--nh) var(--nsd) 21%); --soft: hsl(var(--nh) var(--nsd) 16%);
    --accent: hsl(var(--ah) var(--as) var(--ald)); --accent-soft: hsl(var(--ah) 35% 17%); --accent-ink: var(--aink, #FFFFFF);
    --good: #3DBB7E; --good-soft: #15352A; --warn: #E0A33A; --warn-soft: #3A2E14; --bad: #F2655C; --bad-soft: #42201D;
    --water: #58B4F0; --water-soft: #12303F; --gold: #E3B341;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --dk: 1;
  --bg: hsl(var(--nh) var(--nsd) 7%); --card: hsl(var(--nh) var(--nsd) 12%); --fg: hsl(var(--nh) 10% 95%); --muted: hsl(var(--nh) 8% 67%);
  --line: hsl(var(--nh) var(--nsd) 21%); --soft: hsl(var(--nh) var(--nsd) 16%);
  --accent: hsl(var(--ah) var(--as) var(--ald)); --accent-soft: hsl(var(--ah) 35% 17%); --accent-ink: var(--aink, #FFFFFF);
  --good: #3DBB7E; --good-soft: #15352A; --warn: #E0A33A; --warn-soft: #3A2E14; --bad: #F2655C; --bad-soft: #42201D;
  --water: #58B4F0; --water-soft: #12303F; --gold: #E3B341;
  color-scheme: dark;
}
:root[data-font="soft"] { --display: "Quicksand", "Trebuchet MS", Verdana, sans-serif; --body: "Nunito", "Trebuchet MS", Verdana, sans-serif; --caps: none; --track: 0; }
:root[data-font="classic"] { --display: "Fraunces", Georgia, "Times New Roman", serif; --caps: none; --track: 0; }
:root[data-shape="sharp"] { --r: 4px; }
:root[data-shape="round"] { --r: 20px; }

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--nav-h) + 12px + env(safe-area-inset-top, 0px)); scroll-padding-bottom: 96px; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: .9375rem; line-height: 1.4; margin: 0; }
:root[data-backdrop="dots"] body { background-image: radial-gradient(circle, hsl(var(--ah) var(--as) var(--al) / .14) 1.5px, transparent 1.7px); background-size: 18px 18px; }
:root[data-backdrop="stripes"] body { background-image: repeating-linear-gradient(135deg, hsl(var(--ah) var(--as) var(--al) / .07) 0 12px, transparent 12px 24px); }
:root[data-backdrop="checkers"] body { background-image: conic-gradient(hsl(var(--nh) 10% 50% / .09) 25%, transparent 0 50%, hsl(var(--nh) 10% 50% / .09) 0 75%, transparent 0); background-size: 28px 28px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 16px; }
@media (min-width: 900px) { .wrap { max-width: 640px; } }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; text-transform: var(--caps); }
h2 { font-size: 1.375rem; font-weight: 700; text-transform: var(--caps); letter-spacing: var(--track); }
h3 { font-size: 1.0625rem; font-weight: 600; font-family: var(--body); }
.eyebrow { font-family: var(--display); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.tiny { font-size: .8125rem; }
p { margin: 0; }
a { color: inherit; }
/* before a profile is known: hold the page back rather than flash the wrong person's log */
.nopid .wrap > * { visibility: hidden; }
.nopid .wrap::before { content: "Morning Laps"; display: block; padding: 28vh 0 0; text-align: center; font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: var(--muted, currentColor); letter-spacing: .02em; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
.who { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 3px 12px 3px 3px; min-height: 40px; background: var(--card); font-weight: 600; }
.who::after { content: "▾"; font-size: .75rem; color: var(--muted); }
.av { --ph: 3; --ps: 65%; --pl: 47%; --pld: 57%; width: 34px; height: 34px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.0625rem; line-height: 1;
  color: var(--pink, #fff); background: hsl(var(--ph) var(--ps) calc(var(--pl) * (1 - var(--dk)) + var(--pld) * var(--dk))); }
.av.lg { width: 56px; height: 56px; font-size: 1.75rem; }
.av.sm { width: 26px; height: 26px; font-size: .875rem; }
.strip { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: .8125rem; color: var(--muted); padding-bottom: 6px; min-height: 26px; }
.strip b { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }
.strip a { margin-left: auto; text-decoration: none; }
.pips { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; }
.pip { width: 9px; height: 4px; border-radius: 2px; background: var(--line); }
.pip.on { background: var(--good); }
.pip.lift.on { background: var(--accent); }
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); height: var(--nav-h); }
nav.tabs a { text-decoration: none; color: var(--muted); font-family: var(--display); font-weight: 600; font-size: 1rem; text-transform: var(--caps); letter-spacing: .06em; text-align: center; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); }
.subnav { display: flex; gap: 4px; }
.subnav a { text-decoration: none; color: var(--muted); font-size: .875rem; font-weight: 500; padding: 5px 12px; border-radius: 999px; min-height: 32px; display: inline-flex; align-items: center; }
.subnav a.on { background: var(--fg); color: var(--bg); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; gap: 12px; padding-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card.stack, .stack { display: grid; gap: 10px; }
.banner { background: var(--warn-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: .875rem; display: grid; gap: 8px; }
.banner.good { background: var(--good-soft); }
.banner.bad { background: var(--bad-soft); }
.banner.accent { background: var(--accent-soft); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
button { font: inherit; font-family: var(--body); font-weight: 500; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 12px; min-height: 40px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--display); font-size: 1.125rem; font-weight: 700; text-transform: var(--caps); letter-spacing: .05em; flex: 1; min-height: 46px; }
button.primary:disabled { background: var(--soft); color: var(--muted); border-color: var(--soft); opacity: 1; cursor: default; }
button.small { min-height: 32px; padding: 4px 10px; font-size: .8125rem; }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 6px; min-height: 32px; font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:disabled { opacity: .5; cursor: default; }
.seg { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; min-height: 34px; padding: 4px 6px; font-size: .875rem; color: var(--muted); border-radius: 7px; }
.seg button.on { background: var(--fg); color: var(--bg); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrapc { flex-wrap: wrap; overflow: visible; }
.chips button { flex: none; border-radius: 999px; min-height: 34px; padding: 4px 12px; font-size: .875rem; }
input[type=number], input[type=date], input[type=time], input[type=text], input[type=search], select, textarea { font: inherit; font-size: 1.0625rem; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; width: 100%; font-variant-numeric: tabular-nums; }
input[type=number] { text-align: center; -moz-appearance: textfield; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=search] { -webkit-appearance: none; appearance: none; }
input::placeholder { color: var(--muted); opacity: .6; }
.logrow input[type=number]:not(:placeholder-shown) { border-color: var(--fg); font-weight: 600; }
label.f { display: grid; gap: 3px; font-size: .6875rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; min-width: 0; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }

/* session heading */
.sess { display: grid; gap: 8px; }
.sess .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sess .head input[type=date] { width: auto; min-height: 36px; padding: 4px 8px; font-size: 1rem; } /* 16px keeps iOS from zooming the page on focus */
.datebar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.datebar button { padding: 4px 0; min-height: 46px; display: grid; gap: 1px; justify-items: center; font-weight: 500; font-size: .6875rem; color: var(--muted); border-color: transparent; background: var(--soft); border-radius: 8px; }
.datebar button b { font-family: var(--display); font-size: 1.0625rem; color: var(--fg); }
.datebar button.sel { border-color: var(--fg); background: var(--card); }
.datebar button .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.datebar button .dot.lift { background: var(--accent); }
.datebar button .dot.part { background: var(--warn); }
.datebar button .dot.cardio { background: var(--good); }
.datebar button .dot.draft { border: 2px solid var(--warn); }
.status { font-size: .8125rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* the workout sheet (lifting program) */
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0 14px; }
.blk { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.blk:first-child { border-top: 0; }
.blk .bhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.blk .bhead h3 { flex: 1; min-width: 0; }
.ex { position: relative; }
.exrx { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .875rem; color: var(--muted); }
.exlast { font-size: .875rem; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; }
.exlast button { flex: none; }
.exlast b { color: var(--fg); font-weight: 500; }
.exhold { font-size: .8125rem; color: var(--warn); }
.logrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 6px; align-items: end; }
.logrow label.f { letter-spacing: .05em; }
.exprog { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: var(--muted); }
.exprog b { color: var(--fg); font-weight: 500; }
.stall { display: grid; gap: 6px; padding: 8px 10px; background: var(--warn-soft); border-radius: 8px; font-size: .875rem; }
.spark.trend circle { fill: var(--accent); }
.spark.trend circle.dl { fill: var(--card); stroke: var(--accent); stroke-width: 1.5; }
.exdetails { font-size: .8125rem; color: var(--muted); display: grid; gap: 4px; padding: 8px 10px; background: var(--soft); border-radius: 8px; }
.exdetails b { color: var(--fg); font-weight: 500; }
.menubtn { width: 36px; height: 32px; min-height: 32px; padding: 0; border-radius: 8px; font-size: 1.25rem; line-height: 1; letter-spacing: .05em; color: var(--muted); border-color: transparent; background: transparent; flex: none; }
.menubtn[aria-expanded="true"], .menubtn:hover { background: var(--soft); color: var(--fg); }
.menu { position: absolute; right: 0; top: 36px; z-index: 6; min-width: 230px; max-width: calc(100vw - 48px); background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; display: grid; }
.menu .mh { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 4px; font-weight: 600; }
.menu button { border: 0; background: transparent; text-align: left; border-radius: 7px; padding: 10px 10px; min-height: 42px; font-weight: 500; }
.menu button:hover, .menu button:focus-visible { background: var(--soft); outline: none; }
.menu button .sub { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; }
.menu button:disabled { opacity: .5; }
.collapsed-sum { font-size: .875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.collapsed-sum b { color: var(--fg); font-weight: 500; }
details.plain > summary { cursor: pointer; font-weight: 500; font-size: .875rem; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.plain > summary::-webkit-details-marker { display: none; }
details.plain > summary::before { content: "▸"; font-size: .75rem; }
details.plain[open] > summary::before { content: "▾"; }
details.sessopts { padding: 10px 0 2px; border-top: 1px solid var(--line); }

.locknote { color: var(--muted); margin-top: 4px; }

/* rest timer: its own bar, pinned just above the save bar */
.restbar { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 12px; background: var(--fg); color: var(--bg); overflow: hidden; }
.restbar[hidden] { display: none; }
.restbar b { font-family: var(--display); font-size: 1.375rem; min-width: 2.6em; position: relative; }
.restbar span { flex: 1; min-width: 0; font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.restbar button { position: relative; background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); min-height: 36px; flex: none; }
.restbar i { position: absolute; inset: 0 auto 0 0; width: 0; background: hsl(var(--ah) var(--as) 50% / .45); }
.restbar.done { background: var(--good); color: #fff; }
.restbar.done i { display: none; }

/* save bar */
.savebar { position: sticky; bottom: 0; z-index: 4; background: var(--bg); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; }
.savebar .note { font-size: .8125rem; color: var(--muted); }
.savebar .note.bad { color: var(--bad); font-weight: 500; }
.savebar .note.warn { color: var(--warn); }
.savebar .bar { display: flex; gap: 8px; align-items: center; }
.savebar .st { font-size: .75rem; color: var(--muted); max-width: 40%; line-height: 1.2; }

/* pick-your-own activities */
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 520px) { .acts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.act { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; text-align: left; align-items: center; padding: 10px; min-height: 64px; border-radius: calc(var(--r) * .8); }
.act .ai { grid-row: span 2; font-size: 1.5rem; line-height: 1; }
.act .an { font-weight: 600; font-size: .9375rem; line-height: 1.15; }
.act .am { font-size: .75rem; color: var(--muted); }
.act .aw { grid-column: 1 / -1; font-size: .75rem; color: var(--warn); }
.act.fav { border-color: var(--accent); }
.done-list { display: grid; }
.done-list button { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 0; min-height: 44px; }
.done-list button:first-child { border-top: 0; }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 6px; align-items: center; }
.stepper button { font-size: 1.25rem; min-height: 48px; }
.stepper input { font-size: 1.5rem; font-weight: 600; min-height: 48px; }
.weekdots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: .6875rem; color: var(--muted); }
.weekdots i { display: block; height: 8px; border-radius: 4px; background: var(--soft); margin-top: 3px; }
.weekdots .on i { background: var(--accent); }
.weekdots .rest i { background: var(--line); }
.weekdots .today { color: var(--fg); font-weight: 600; }

/* fuel */
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ringbox { position: relative; display: grid; justify-items: center; gap: 4px; }
.ring { width: 100%; max-width: 150px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.ring .rbg { stroke: var(--soft); }
.ring .rfg { stroke: var(--accent); transition: stroke-dashoffset .6s ease; }
.ring.water .rfg { stroke: var(--water); }
.ring.over .rfg { stroke: var(--warn); }
.ringtxt { position: absolute; inset: 0 0 auto 0; aspect-ratio: 1; max-width: 150px; margin: 0 auto; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ringtxt b { font-family: var(--display); font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ringtxt span { font-size: .75rem; color: var(--muted); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.macro { display: grid; gap: 3px; font-size: .8125rem; }
.macro .bar, .mini .bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.macro .bar i, .mini .bar i { display: block; height: 100%; background: var(--fg); border-radius: 3px; }
.macro b { font-variant-numeric: tabular-nums; }
.macros.two { grid-template-columns: repeat(2, 1fr); }
.protline { display: grid; gap: 4px; }
.protline .bar { position: relative; height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
.protline .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.protline .bar em { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: .55; }
.meal { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.meal:first-child { border-top: 0; }
.mealtools { display: flex; flex-wrap: wrap; gap: 0 10px; margin-top: 2px; }
.mealtools button { min-height: 30px; padding: 2px 0; }
.mealrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
.mealrow:first-child { border-top: 0; }
.results .mealrow .fooditem { border-top: 0; }
.meal .mh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fooditem { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 0; min-height: 40px; width: 100%; }
.fooditem .fn { font-weight: 500; line-height: 1.2; }
.fooditem .fq { font-size: .8125rem; color: var(--muted); grid-column: 1; }
.fooditem .fk { grid-row: span 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.results { display: grid; }
.results .fooditem { border-top: 1px solid var(--line); border-radius: 0; padding: 9px 0; }
.results .fooditem:first-child { border-top: 0; }
.facts { border: 2px solid var(--fg); padding: 6px 10px 8px; font-family: Helvetica, Arial, sans-serif; background: var(--card); color: var(--fg); border-radius: 4px; text-align: left; font-size: .875rem; }
.facts .ft { font-weight: 900; font-size: 1.7rem; line-height: 1.05; letter-spacing: -.01em; }
.facts .srv { font-size: .8125rem; border-bottom: 8px solid var(--fg); padding-bottom: 4px; }
.facts .cal { display: flex; justify-content: space-between; align-items: flex-end; font-weight: 900; border-bottom: 4px solid var(--fg); padding: 2px 0; }
.facts .cal b { font-size: 1.9rem; line-height: 1; }
.facts .dvh { text-align: right; font-size: .75rem; font-weight: 700; padding: 2px 0; }
.facts .fr { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--muted); padding: 2px 0; }
.facts .fr.sub { padding-left: 14px; }
.facts .fr.thick { border-top: 8px solid var(--fg); }
.facts .fr b { font-weight: 700; }
.facts .fnote { border-top: 4px solid var(--fg); font-size: .6875rem; padding-top: 4px; color: var(--muted); }
.waterbtns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.waterbtns button { min-height: 36px; padding: 4px 10px; font-size: .875rem; border-radius: 999px; }

/* compete */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.vs .side { display: grid; justify-items: center; gap: 2px; }
.vs .pts { font-family: var(--display); font-size: 2.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vs .mid { font-family: var(--display); font-weight: 700; color: var(--muted); }
.race { display: grid; gap: 14px; padding: 6px 0 2px; }
.lane { --p: 0; --ph: 3; --ps: 65%; --pl: 47%; --pld: 57%; position: relative; height: 40px; border-radius: 20px; background: var(--soft); }
.lane::before { content: ""; position: absolute; inset: 0; border-radius: 20px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%); }
.lane::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 12px; border-radius: 0 20px 20px 0; background: conic-gradient(var(--fg) 25%, var(--card) 0 50%, var(--fg) 0 75%, var(--card) 0) 0 0 / 8px 8px; opacity: .55; }
.lane .fill { position: absolute; inset: 0 auto 0 0; width: calc(40px + (100% - 40px) * var(--p)); border-radius: 20px; background: hsl(var(--ph) var(--ps) calc(var(--pl) * (1 - var(--dk)) + var(--pld) * var(--dk)) / .28); }
.lane .car { position: absolute; top: 3px; left: calc(3px + (100% - 40px) * var(--p)); z-index: 1; }
.mini { display: grid; grid-template-columns: 72px 1fr 1fr; gap: 4px 10px; align-items: center; font-size: .8125rem; }
.mini .bar i { background: hsl(var(--ph, 3) var(--ps, 65%) calc(var(--pl, 47%) * (1 - var(--dk)) + var(--pld, 57%) * var(--dk))); }
.mini .cell { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1.3fr) minmax(40px, 1fr) auto; gap: 8px; align-items: center; font-size: .875rem; }
.trow .tn { line-height: 1.2; min-width: 0; }
.trow .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.trow .bar i { display: block; height: 100%; border-radius: 4px; background: hsl(var(--ph, 3) var(--ps, 65%) calc(var(--pl, 47%) * (1 - var(--dk)) + var(--pld, 57%) * var(--dk))); }
.recap { display: grid; grid-template-columns: minmax(0, 1.5fr) 1fr 1fr; gap: 5px 10px; align-items: start; font-size: .8125rem; text-align: left; width: 100%; }
.recap b { font-weight: 600; }
.ious { display: grid; }
.iou { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: .875rem; }
.iou:first-child { border-top: 0; }
.iou.paid > span { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.tips { display: grid; }
.tip { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; }
.tip:first-child { border-top: 0; }
.tip .gain { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--good); font-variant-numeric: tabular-nums; }
.weeks { display: grid; }
.weeks .wk { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .875rem; }
.weeks .wk:first-child { border-top: 0; }

/* me */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px 6px; }
.badge { display: grid; justify-items: center; align-content: start; gap: 5px; text-align: center; border: 0; background: transparent; padding: 4px 2px; min-height: 0; }
.medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; line-height: 1; background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--card), 0 0 0 2px var(--accent); }
.medal.lg { width: 96px; height: 96px; font-size: 2.75rem; box-shadow: inset 0 0 0 5px var(--card), 0 0 0 4px var(--accent); }
.badge.locked .medal { background: var(--soft); box-shadow: inset 0 0 0 3px var(--card), 0 0 0 2px var(--line); filter: grayscale(1); opacity: .5; }
.badge .bn { font-size: .75rem; font-weight: 600; line-height: 1.15; }
.badge.locked .bn { color: var(--muted); font-weight: 500; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { --ph: 3; --ps: 65%; --pl: 47%; --pld: 57%; width: 42px; height: 42px; min-height: 0; border-radius: 50%; padding: 0; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); background: hsl(var(--ph) var(--ps) calc(var(--pl) * (1 - var(--dk)) + var(--pld) * var(--dk))); }
.sw.on, .sw.on:hover { box-shadow: 0 0 0 3px var(--fg); border-color: var(--card); background: hsl(var(--ph) var(--ps) calc(var(--pl) * (1 - var(--dk)) + var(--pld) * var(--dk))); }
input[type=color] { width: 42px; height: 42px; min-height: 0; padding: 0; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); border-radius: 50%; background: none; overflow: hidden; }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; }
.emojis button { font-size: 1.25rem; padding: 0; min-height: 40px; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.formgrid .wide { grid-column: 1 / -1; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .9375rem; }
.kv b { font-variant-numeric: tabular-nums; }
.spark { width: 100%; height: 64px; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark circle { fill: var(--accent); }

/* history, program */
.hist { display: grid; }
details.hi { border-top: 1px solid var(--line); padding: 8px 0; }
details.hi:first-child { border-top: 0; }
details.hi > summary { list-style: none; display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
details.hi > summary::-webkit-details-marker { display: none; }
.hdate { font-family: var(--display); font-weight: 700; font-size: 1.0625rem; line-height: 1; }
.hbody { padding: 8px 0 4px 0; display: grid; gap: 6px; font-size: .875rem; }
.hbody table, .tbl table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hbody td, .tbl td { padding: 3px 0; border-top: 1px solid var(--line); vertical-align: top; }
.hbody td:last-child, .tbl td:last-child { text-align: right; white-space: nowrap; }
.tbl { overflow-x: auto; }
.plan ul { padding: 0; margin: 0; }
.plan li { list-style: none; display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: .9375rem; }
.plan li:first-child { border-top: 0; }
.sched { display: grid; grid-template-columns: 56px 1fr; gap: 4px 10px; font-size: .9375rem; }
.sched .t { font-family: var(--display); font-weight: 700; font-size: 1.0625rem; }
ul.rules { margin: 6px 0 0 18px; padding: 0; display: grid; gap: 4px; font-size: .8125rem; }

/* Apple Health import */
textarea { resize: vertical; min-height: 132px; font-size: 1rem; line-height: 1.4; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: .875rem; }
ol.steps code, pre.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--soft); border-radius: 5px; padding: 1px 5px; font-size: .8125rem; }
pre.code { padding: 8px 10px; margin: 6px 0; overflow-x: auto; line-height: 1.5; }
.hkrow { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.hkrow:first-of-type { border-top: 0; }
.tick { width: 34px; height: 34px; min-height: 34px; padding: 0; border-radius: 8px; font-weight: 700; display: grid; place-items: center; }
.tick.on { background: var(--good); border-color: var(--good); color: #fff; }
.tick.off { border: 1px dashed var(--line); color: var(--muted); }

/* overlays */
.ov-root { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 10, 14, .55); padding-top: calc(28px + env(safe-area-inset-top, 0px)); }
.ov { background: var(--card); color: var(--fg); width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; border-radius: 18px 18px 0 0; display: grid; gap: 12px; align-content: start;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ov.tall { height: 100%; }
.ov-root.center { align-items: center; padding: 16px; }
.ov-root.center .ov { border-radius: 18px; max-width: 380px; text-align: center; justify-items: center; padding: 22px 18px 18px; }
.ov-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ov-head h2 { font-size: 1.25rem; }
.xbtn { width: 40px; min-height: 40px; padding: 0; border-color: transparent; background: var(--soft); border-radius: 50%; font-size: 1.125rem; line-height: 1; flex: none; }
.whocard { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px; min-height: 76px; border-radius: var(--r); }
.whocard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
@keyframes pop { 0% { transform: scale(.2) rotate(-25deg); opacity: 0; } 60% { transform: scale(1.12) rotate(6deg); opacity: 1; } 100% { transform: none; } }
.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; z-index: 45; max-width: calc(100vw - 32px); text-align: center; font-size: .875rem; }
@media (prefers-reduced-motion: no-preference) {
  button { transition: background .12s, color .12s; }
  .restbar.done { animation: flash .5s ease 4; }
  .lane .car { animation: carrun 1.1s cubic-bezier(.2, .8, .2, 1) both; }
  .lane .fill { animation: fillrun 1.1s cubic-bezier(.2, .8, .2, 1) both; }
  .bump { animation: bump .35s ease; }
  .pop { animation: pop .6s cubic-bezier(.2, 1.3, .4, 1) both; }
}
@keyframes carrun { from { left: 3px; } }
@keyframes fillrun { from { width: 40px; } }
@keyframes bump { 50% { transform: scale(1.12); } }
@keyframes flash { 50% { opacity: .35; } }

/* ---------- Version 15: undo, stuck-lift line, scan, describe, backup ---------- */
.toast.act { display: flex; align-items: center; gap: 2px; padding: 4px 6px 4px 16px; text-align: left; }
.toast .undo { background: transparent; border: 0; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; min-height: 40px; padding: 4px 12px; white-space: nowrap; }
.stallline { display: flex; align-items: center; flex-wrap: wrap; font-size: .8125rem; color: var(--warn); font-weight: 500; min-height: 32px; }
.stallline button.quiet { color: var(--warn); font-weight: 600; }
.filebtn { position: relative; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; font-family: var(--body); font-weight: 500; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 12px; min-height: 40px; }
.filebtn.small { min-height: 32px; padding: 4px 10px; font-size: .8125rem; }
.filebtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; opacity: 0; cursor: pointer; font-size: 0; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip.est { font-size: .6875rem; font-weight: 600; padding: 0 5px; vertical-align: 1px; }
input.unread { border-color: var(--warn); background: var(--warn-soft); }
.ov .formgrid { align-items: end; }
label.f .chip { text-transform: none; letter-spacing: 0; }
textarea.plaintext { font-family: var(--body); min-height: 88px; }
.estrow { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.estrow:first-child { border-top: 0; }
.esthead { display: flex; gap: 8px; align-items: center; }
.esthead input { flex: 1; min-width: 0; font-weight: 600; }
.esthead button { flex: none; min-height: 44px; }
.estnums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.estnums input { padding: 8px 4px; }
.estnums label.f { letter-spacing: .04em; }

/* ---------- Version 16: check-in, Healthplex cards, workout mode ---------- */
.ci .cic { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; min-height: 52px; padding: 8px 12px; border-radius: calc(var(--r) * .8); }
.ci .cic .ci-i { font-size: 1.375rem; line-height: 1; }
.ci .cic .ci-t { display: grid; gap: 1px; min-width: 0; }
.ci .cic .ci-t .tiny { color: var(--muted); font-weight: 400; }
.ci .cic.sug { border-color: var(--accent); }
.ci .cic.sel { border-color: var(--fg); box-shadow: 0 6px 16px rgba(0, 0, 0, .14); transform: translateY(-2px); }
.ci .cic.fade { opacity: .45; }
.cip { display: grid; gap: 8px; padding: 10px 12px; background: var(--soft); border-radius: calc(var(--r) * .8); transform-origin: top center; }
.cip .primary { min-height: 52px; }
.ci-moves { margin: 0; padding-left: 20px; display: grid; gap: 2px; font-size: .875rem; }
.chipbtn { border-radius: 999px; min-height: 44px; padding: 6px 14px; font-size: .875rem; background: var(--accent-soft); border-color: transparent; }
.act.hp.back { grid-template-columns: 1fr; gap: 6px; grid-column: 1 / -1; border: 1px solid var(--accent); background: var(--card); padding: 10px; }
.act .aw[data-tag] { color: var(--muted); }
.wm { position: fixed; inset: 0; height: 100vh; height: 100dvh; z-index: 35; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden; padding: env(safe-area-inset-top, 0px) 0 0; }
.wm[hidden] { display: none; }
.wm-top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex: none; max-width: 560px; width: 100%; margin: 0 auto; }
.wm-x { width: 44px; min-height: 44px; padding: 0; border-radius: 50%; background: var(--soft); border-color: transparent; font-size: 1rem; flex: none; }
.wm-strip { --p: 0%; position: relative; flex: 1; height: 26px; border-radius: 13px; background: var(--soft); }
.wm-fill { position: absolute; inset: 0 auto 0 0; width: max(26px, var(--p)); max-width: 100%; border-radius: 13px; background: hsl(var(--ah) var(--as) var(--al) / .3); }
.wm-lapmark { position: absolute; top: 5px; bottom: 5px; width: 2px; background: var(--line); }
.wm-car { position: absolute; top: 0; left: max(0px, calc(var(--p) - 26px)); z-index: 1; display: block; height: 26px; }
.wm-end { position: absolute; right: 0; top: 0; bottom: 0; width: 12px; border-radius: 0 13px 13px 0; background: conic-gradient(var(--fg) 25%, var(--card) 0 50%, var(--fg) 0 75%, var(--card) 0) 0 0 / 8px 8px; opacity: .55; }
.wm-clock { font-family: var(--display); font-size: 1.25rem; font-weight: 700; min-width: 3em; text-align: right; flex: none; }
.wm-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 12px; display: grid; gap: 8px; align-content: start; max-width: 560px; width: 100%; margin: 0 auto; }
.wm-body.wm-center { justify-items: center; text-align: center; align-content: center; gap: 12px; }
.wm-body h2 { font-size: 1.75rem; }
.wm-body h3 { font-size: 1.375rem; }
.wm-target { font-size: 1.125rem; }
.wm-how { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; }
.wm-demo { background: var(--card); border: 1px solid var(--line); border-radius: 12px; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
.wm-demo svg { width: 100%; height: 100%; display: block; }
.wm-cues { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .9375rem; line-height: 1.25; }
.wm-mistake { font-size: .875rem; background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; }
.wm-btn { min-height: 48px; padding: 8px 16px; font-size: 1rem; font-weight: 600; border-radius: 12px; }
.wm-btn.sm { min-height: 44px; font-size: .875rem; padding: 6px 12px; }
.wm-btn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.wm-btn.danger { color: var(--bad); border-color: var(--bad); }
.wm-pips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.wm-pip { width: 48px; min-height: 48px; border-radius: 50%; padding: 0; font-family: var(--display); font-size: 1.25rem; font-weight: 700; color: var(--muted); background: var(--soft); border-color: transparent; }
.wm-pip:disabled { opacity: 1; }
.wm-pip.on { background: var(--accent); color: var(--accent-ink); }
.wm-pip.next { box-shadow: 0 0 0 2px var(--fg); color: var(--fg); }
.wm-pip.edit { box-shadow: 0 0 0 3px var(--fg); }
.wm-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.wm-steps.one { grid-template-columns: 1fr; }
.wm-step { display: grid; gap: 4px; justify-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.wm-step > div { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; width: 100%; text-align: center; }
.wm-step button { min-height: 52px; font-size: 1.5rem; padding: 0; border-radius: 12px; }
.wm-step b { font-family: var(--display); font-size: 2.25rem; line-height: 1; }
.wm-log { width: 100%; min-height: 60px; font-size: 1.375rem; flex: none; }
.wm-tap { width: 100%; min-height: 96px; font-size: 1.75rem; flex: none; }
.wm-nav { display: flex; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); flex: none; max-width: 560px; width: 100%; margin: 0 auto; }
.wm-nav .wm-btn { flex: 1; padding: 8px 6px; }
.wm-ring { position: relative; width: min(240px, 60vw); aspect-ratio: 1; display: grid; place-items: center; }
.wm-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.wm-ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.wm-ring .rbg { stroke: var(--soft); }
.wm-ring .rfg { stroke: var(--accent); }
.wm-ring b { font-family: var(--display); font-size: 3.5rem; }
.wm-nextup { display: grid; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; width: 100%; }
.wm-bigtime { font-family: var(--display); font-weight: 700; font-size: 4.5rem; line-height: 1; }
.wm-stat { display: flex; gap: 22px; justify-content: center; }
.wm-stat div { display: grid; justify-items: center; }
.wm-stat b { font-family: var(--display); font-size: 2rem; line-height: 1; }
.wm-stat span { font-size: .8125rem; color: var(--muted); }
.wm-stations { display: grid; gap: 8px; width: 100%; }
.wm-stations .wm-btn { display: flex; justify-content: space-between; align-items: center; }
.wm-cue { font-size: 1.0625rem; }
.wm-done { font-weight: 600; color: var(--good); }
.wm-sum { display: grid; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; text-align: left; }
.wm-sum > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.wm-sum > div:first-child { border-top: 0; }
.wm-ups { font-size: .9375rem; }
.wm-swaps { display: grid; gap: 6px; }
.wm-flag { width: 120px; height: 100px; color: var(--fg); }

function scoreSnapshot() { const ws = weekStart(todayIso()), o = {}; PIDS.forEach(p => { o[p] = weekScore(p, ws).total; }); return o; }
function keepBadges(pid) { // write newly earned badges onto the profile, with the day they were earned
  if (!state.ready || state.cantWrite) return;
  const fresh = badgesFor(pid).filter(b => b.live && !b.since); if (!fresh.length) return;
  const cur = state.data[pid].profile || {}, badges = Object.assign({}, cur.badges);

function checkBadges(pid, quiet) { // returns badges earned since this device last looked
  keepBadges(pid);

  if (seen == null || quiet) { prefSet('ml.badges.' + pid, earned.map(b => b.id)); return []; }

let sweepT = 0, sweepAt = 0;
function milestone() {
  if (motionOf() !== 'subtle') return; // Full has its own bursts; Off shows nothing
  const now = Date.now(); if (now - sweepAt < 1500) return;
  sweepAt = now; state.fxn.milestone++;

  if (msg) toast(msg + (gained > 0 ? '  +' + gained + ' pts' : ''), opts.ms || 3000);
  const lead = prev[pid] <= prev[other] && now[pid] > now[other] && now[other] > 0, earned = checkBadges(pid).slice(0, 3);

// On opening the app: badges, then last week's result. A finished week stays open for late entries through Tuesday,

// when the final result exists (ml.seenFinalWeek: the newest final week this phone has shown).
function announce() {
  const pid = me(), earned = checkBadges(pid).slice(0, 3);

    // announcement once final. A phone with no memory at all treats only the week that just ended as news, whether
    // that week was closed before or after this phone picked its profile.

/* ---------- Rest timer: a bar in the foot of the lift sheet ---------- */
// Logging a set for today starts a countdown. The bar is part of the lift sheet's foot, above the Save bar and outside
// the part that scrolls, so it never sits on top of a button. It is patched in place by id (like the toast), never
// through render(), so it cannot disturb typing; when the sheet is redrawn it is drawn again from restT. It stops
// when the lift is saved or the sheet closes. No sound: a buzz where the browser supports vibration.
const restT = { end: 0, total: 0, tick: 0, hide: 0, done: false, label: '' };
const restSeconds = () => { const v = Number(state.settings.rest); return v === 60 || v === 120 ? v : 90; }; // main lifts; set on the Program tab
const restFor = key => EX[key] && (EX[key].bw || CORE.includes(key)) ? 60 : restSeconds();                   // core and bodyweight moves rest 60 s
const restClock = () => { const left = Math.max(0, Math.ceil((restT.end - Date.now()) / 1000)); return Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
const restLabel = () => restT.done ? 'Rest over · next set' : 'Rest' + (restT.label ? ' · ' + restT.label : '');
const restBarHTML = () => '<div id="rest" class="restbar' + (restT.done ? ' done' : '') + '" role="timer" aria-label="Rest timer"' + (restT.end ? '' : ' hidden') + '><i id="restFill"></i><b class="num" id="restTime">' + (restT.end ? restClock() : '1:30') + '</b><span id="restLabel">' + esc(restLabel()) + '</span>' +
  '<button type="button" class="small" data-a="timer-add" aria-label="Add 15 seconds">+15 s</button><button type="button" class="small" data-a="timer-x" aria-label="Dismiss rest timer">×</button></div>';
function restDraw() {
  const bar = $('#rest'); if (!bar) { if (restT.end) restStop(); return; } // the sheet is gone: so is the timer
  if (bar.hidden) return;
  const ms = restT.end - Date.now(), left = Math.max(0, Math.ceil(ms / 1000));
  $('#restTime').textContent = restClock();
  $('#restFill').style.width = (restT.total ? clamp(1 - ms / (restT.total * 1000), 0, 1) * 100 : 0).toFixed(1) + '%';
  if (left <= 0 && !restT.done) {
    restT.done = true; bar.classList.add('done'); $('#restLabel').textContent = restLabel();
    try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch (e) { /* not supported */ }
    clearInterval(restT.tick); restT.tick = 0; restT.hide = setTimeout(restStop, 8000);
  }
}

  clearInterval(restT.tick); clearTimeout(restT.hide);
  restT.total = sec; restT.end = Date.now() + sec * 1000; restT.done = false; restT.label = label || '';
  bar.hidden = false; bar.classList.remove('done'); $('#restLabel').textContent = restLabel();
  restDraw(); restT.tick = setInterval(restDraw, 250);
}

  const bar = $('#rest'); clearInterval(restT.tick); clearTimeout(restT.hide); restT.tick = 0; restT.end = 0; restT.done = false; restT.label = '';
  if (bar) { bar.hidden = true; bar.classList.remove('done'); }
}

  if (!restT.end) return;
  restT.end = Math.max(restT.end, Date.now()) + 15000; restT.total += 15;
  if (restT.done) { restT.done = false; clearTimeout(restT.hide); const bar = $('#rest'); if (bar) { bar.classList.remove('done'); $('#restLabel').textContent = restLabel(); } restT.tick = setInterval(restDraw, 250); }

function dotClass(date, mode) {
  const pid = me();
  if (mode === 'fuel') { const u = fuelUnit(pid, date), t = dayTotals(pid, date); return u >= 1 ? 'cardio' : (t.count || t.water) ? 'part' : ''; }
  const rec = state.sessions[date], d = state.drafts[date]; let c = '';
  if (rec) { const n = normalize(rec), di = dayInfo(pid, date); c = n.qualifies ? 'lift' : n.kind === 'strength' ? 'part' : di.active ? 'cardio' : n.kind === 'activity' ? 'part' : ''; }
  if (d && draftHasContent(d)) c += ' draft';
  return c;
}
function renderDatebar(mode) {
  const t = todayIso(); let out = '<div class="datebar" aria-label="Last 7 days"' + (mode ? ' data-mode="' + mode + '"' : '') + '>';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i);

}
function dateHead(label, mode) {

}
const hkLineHTML = date => { const t = healthLine(me(), date); return t ? '<p class="tiny muted" id="hkLine" style="margin-top:-4px">' + esc(t) + '</p>' : ''; };
function statusText(date) {
  if (!state.ready) return state.storage === 'nodb' ? 'Log unreachable · inputs kept on this phone' : 'Loading your log…';
  const all = state.sessions[date], rec = lifted(all) ? all : null; const d = state.drafts[date]; const st = state.status[date];
  if (st && st.s === 'saving') return 'Saving…';
  if (st && st.s === 'failed') return 'Save failed · inputs kept';
  const hasDraft = d && draftHasContent(d);
  if (rec && st && st.s === 'synced') return 'Saved · synced' + (hasDraft ? ' · unsaved changes' : '');
  if (rec && st && st.s === 'local') return 'Saved in this browser' + (hasDraft ? ' · unsaved changes' : '');
  if (rec) return 'Saved' + (hasDraft ? ' · unsaved changes' : '');

}

function liftLogHTML(date) {

  const m = model(date); const d = state.drafts[date];
  const kind = kindFor(date, m); const isLift = !!DAYS[kind];
  const phase = phaseOf(date);
  const last = lastLift(date); const nextK = nextDayKey(date);
  let why = last ? 'After ' + DAYS[last.n.day].name + ' on ' + nice(last.date) + ', ' + DAYS[nextK].name + ' is next.' : (splitOf() === 'full' ? 'Next lift: ' + DAYS[nextK].name + '.' : 'First lift of the program: Push.');
  if (n && n.qualifies && n.day) why = 'Counted ' + DAYS[n.day].name + ' day. Next: ' + DAYS[nextAfter(n.day)].name + '.';
  else if (n && n.kind === 'strength') why = 'Partial lift, not counted. ' + DAYS[nextK].name + ' is still next.';
  else if (isLift && kind !== nextK) why += ' You picked ' + DAYS[kind].name + '.';

  const rot = rotation(), segDays = !DAYS[kind] || rot.includes(kind) ? rot : rot.concat([kind]), full = !!(DAYS[kind] ? DAYS[kind].full : splitOf() === 'full'); // an old day from the other split keeps its own button

    '<button type="button" data-kind="cardio" class="' + (kind === 'cardio' ? 'on' : '') + '" aria-pressed="' + (kind === 'cardio') + '">Treadmill</button><button type="button" data-kind="rest" class="' + (kind === 'rest' ? 'on' : '') + '" aria-pressed="' + (kind === 'rest') + '">Rest</button></div>' +
    '<div class="status"><span id="statusLine">' + esc(statusText(date)) + '</span>' + (full ? '' : '<span>·</span><span>Phase ' + phase + '</span>') + '</div>' +
    '<p class="tiny muted" id="whyLine" style="margin-top:-4px">' + esc(why) + '</p>';
  if (d && d.recovered && draftHasContent(d)) h += '<div class="banner"><span>Unsaved draft from ' + tzTime.format(new Date(d.updatedAt)) + ' restored. Not saved until you tap Save.</span><div class="row"><button type="button" class="small" id="discardDraft">Discard draft</button></div></div>';
  if (n && n.ambiguous) h += '<div class="banner">Saved as a ' + (DAYS[rec.day] ? DAYS[rec.day].name : 'lift') + ' day by the earlier version but has no lifting sets. It counts as ' + (n.kind === 'cardio' ? 'treadmill only' : 'no activity') + '. Add sets or re-save to confirm.</div>';

  h += '<form id="logForm" autocomplete="off" class="sheet"><div class="blk"><div class="bhead"><h3>' + (full && isLift ? 'Warm-up (track, treadmill or bike)' : 'Treadmill · Apple Fitness+') + '</h3><span class="tiny muted">target ' + (full && isLift ? '5–10' : TREAD_MIN[phase]) + ' min</span></div>' +
    '<div class="logrow" style="grid-template-columns:minmax(80px,1fr) 2fr"><label class="f">Minutes<input type="number" id="tmMin" data-field="tmMin" min="0" step="1" inputmode="numeric" pattern="[0-9]*" value="' + esc(m.tm.minutes) + '" placeholder="–"></label>' +

    planned.forEach(p => { h += renderExercise(p, m, date); });

/* --- the check-in --- */
const CI_PROGRAM = [['strong', '💪', 'Feeling strong'], ['short', '⏱️', 'Short on time'], ['tired', '🚶', 'Tired, just want to move'], ['sore', '🧊', 'Sore or run down'], ['rest', '🛌', 'Not going today']];
const CI_CHOICE = [['good', '🙂', 'Feeling good'], ['low', '🌤️', 'Low energy'], ['sore', '🧊', 'Sore or run down'], ['rest', '🛌', 'Not today']];

const safeAct = (pid, k) => !actCaution(pid, k).length && !painFlag(pid, k);

// the most recent saved days before `date`, newest first, and whether each one was a sore day
function soreTrail(pid, date) {
  return recordsOf(pid).filter(r => r.date < date).slice(-2).reverse().map(r => r.rec.checkin === 'sore' || r.n.acts.some(a => a.hurt));
}
const liftKindFor = date => { const k = kindFor(date, model(date)); return DAYS[k] ? k : nextDayKey(date); };
// The suggestion, by the rules in order. Returns { choice, why }.
function checkinSuggest(pid, date) {
  const sore = soreTrail(pid, date), wasSore = sore[0] && !sore[1]; // one recovery day after a sore day, not an endless run of them
  if (P(pid).plan !== 'program') {
    let choice = wasSore ? 'sore' : dayInfo(pid, addDays(date, -1)).active ? 'low' : 'good', why = wasSore ? 'Last time was a sore day.' : choice === 'low' ? 'You were active yesterday.' : 'A normal day: a little cardio, then the machines.';
    // never something that loads a protected area or has hurt twice lately: step down to the next gentlest
    if (choice === 'good') { const g = ciStages(pid, 'good'); if (g.blocked) { choice = 'low'; why = g.blocked + ' Low energy is the next gentlest.'; } else if (g.note) why = g.note; }
    if (choice === 'low') { const l = ciStages(pid, 'low'); if (l.blocked) { choice = 'sore'; why = l.blocked + ' Stretching is the next gentlest.'; } else if (l.note && !/next gentlest/.test(why)) why = l.note; }
    return { choice, why };
  }
  if (wasSore) return { choice: 'sore', why: 'Last time was a sore day.' };
  const rec = recordsOf(pid), y = rec.find(r => r.date === addDays(date, -1)), ws = weekStart(date), g = weekGoals(pid, ws);
  if (y && y.n.kind === 'strength') return { choice: 'tired', why: 'You lifted yesterday.' };
  const done = rec.filter(r => r.date >= ws && r.date < date && r.n.qualifies).length, need = g.plan === 'program' ? Math.max(0, g.liftGoal - done) : 0, left = 7 - ((dow(date) + 6) % 7);
  if (need > 0 && left <= 2 * need - 1) return { choice: 'short', why: need + ' lift' + (need === 1 ? '' : 's') + ' to go, ' + left + ' day' + (left === 1 ? '' : 's') + ' left.' }; // no room left to skip a day between lifts
  const last = lastLift(date, pid), gap = last ? Math.round((toUTC(date) - toUTC(last.date)) / 86400000) : null;
  if (gap != null && gap >= 3) return { choice: 'strong', why: gap + ' days since your last lift.' };
  return isWeekend(date) ? { choice: 'tired', why: 'A weekend: keep it easy.' } : { choice: 'strong', why: 'A weekday: a good day for the full lift.' };

function pickDay(v) { // from the 7-day strip or the date picker, on Fuel's card or in the date sheet

function bind(root) {

function save() {

    const msg = r.kind === 'cardio' && r.fromLift ? r.doc.treadmill.minutes + ' treadmill minutes saved. No lifting sets recorded; ' + DAYS[nextDayKey(date)].name + ' remains next.'

      : r.kind === 'rest' ? 'Rest day saved.' : 'Treadmill saved.';
    markRow(date, 'prog');

    if (up) milestone();
    celebrate(msg + (st && st.s === 'synced' ? ' Synced.' : st && st.s === 'local' ? ' Saved in this browser.' : ''), { ms: 3800, before });
    return true;
  });
  if (state.ready && !state.settings.startDate) saveSettings({ startDate: date < todayIso() ? date : todayIso() });
  return done; // resolves true once the day is saved (workout mode waits on it)
}

/* ---------- Routing and boot ---------- */
const TABS = ['train', 'program', 'history', 'fuel', 'compete', 'me'];
