<title>Morning Laps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Header with profile chip, a slim weekly strip, four underline tabs.
   Every color derives from six numbers a profile's look sets on :root (accent hue/saturation/lightness, neutral hue/saturation). */
:root {
  --ah: 3; --as: 65%; --al: 47%; --ald: 57%;      /* accent: brick by default */
  --nh: 212; --ns: 12%; --nsd: 12%;               /* neutrals lean toward this hue */
  --dk: 0;
  --bg: hsl(var(--nh) var(--ns) 94%);
  --card: #FFFFFF;
  --fg: hsl(var(--nh) 14% 10%);
  --muted: hsl(var(--nh) 9% 39%);
  --line: hsl(var(--nh) 13% 87%);
  --soft: hsl(var(--nh) 15% 91%);
  --accent: hsl(var(--ah) var(--as) var(--al));
  --accent-soft: hsl(var(--ah) var(--as) 95%);
  --accent-ink: var(--aink, #FFFFFF);
  --good: #1E8E5A; --good-soft: #DCF2E6;
  --warn: #9A6410; --warn-soft: #F6ECD4;
  --bad: #B3261E; --bad-soft: #F8DAD7;
  --water: #1C7BB8; --water-soft: #DCEEF9;
  --gold: #B8860B;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --caps: uppercase; --track: .02em;
  --r: 12px;
  --nav-h: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --dk: 1;
    --bg: hsl(var(--nh) var(--nsd) 7%); --card: hsl(var(--nh) var(--nsd) 12%); --fg: hsl(var(--nh) 10% 95%); --muted: hsl(var(--nh) 8% 67%);
    --line: hsl(var(--nh) var(--nsd) 21%); --soft: hsl(var(--nh) var(--nsd) 16%);
    --accent: hsl(var(--ah) var(--as) var(--ald)); --accent-soft: hsl(var(--ah) 35% 17%); --accent-ink: var(--aink, #FFFFFF);
    --good: #3DBB7E; --good-soft: #15352A; --warn: #E0A33A; --warn-soft: #3A2E14; --bad: #F2655C; --bad-soft: #42201D;
    --water: #58B4F0; --water-soft: #12303F; --gold: #E3B341;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --dk: 1;
  --bg: hsl(var(--nh) var(--nsd) 7%); --card: hsl(var(--nh) var(--nsd) 12%); --fg: hsl(var(--nh) 10% 95%); --muted: hsl(var(--nh) 8% 67%);
  --line: hsl(var(--nh) var(--nsd) 21%); --soft: hsl(var(--nh) var(--nsd) 16%);
  --accent: hsl(var(--ah) var(--as) var(--ald)); --accent-soft: hsl(var(--ah) 35% 17%); --accent-ink: var(--aink, #FFFFFF);
  --good: #3DBB7E; --good-soft: #15352A; --warn: #E0A33A; --warn-soft: #3A2E14; --bad: #F2655C; --bad-soft: #42201D;
  --water: #58B4F0; --water-soft: #12303F; --gold: #E3B341;
  color-scheme: dark;
}
:root[data-font="soft"] { --display: "Quicksand", "Trebuchet MS", Verdana, sans-serif; --body: "Nunito", "Trebuchet MS", Verdana, sans-serif; --caps: none; --track: 0; }
:root[data-font="classic"] { --display: "Fraunces", Georgia, "Times New Roman", serif; --caps: none; --track: 0; }
:root[data-shape="sharp"] { --r: 4px; }
:root[data-shape="round"] { --r: 20px; }

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--nav-h) + 12px + env(safe-area-inset-top, 0px)); scroll-padding-bottom: 96px; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: .9375rem; line-height: 1.4; margin: 0; }
:root[data-backdrop="dots"] body { background-image: radial-gradient(circle, hsl(var(--ah) var(--as) var(--al) / .14) 1.5px, transparent 1.7px); background-size: 18px 18px; }
:root[data-backdrop="stripes"] body { background-image: repeating-linear-gradient(135deg, hsl(var(--ah) var(--as) var(--al) / .07) 0 12px, transparent 12px 24px); }
:root[data-backdrop="checkers"] body { background-image: conic-gradient(hsl(var(--nh) 10% 50% / .09) 25%, transparent 0 50%, hsl(var(--nh) 10% 50% / .09) 0 75%, transparent 0); background-size: 28px 28px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 16px; }
@media (min-width: 900px) { .wrap { max-width: 640px; } }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; text-transform: var(--caps); }
h2 { font-size: 1.375rem; font-weight: 700; text-transform: var(--caps); letter-spacing: var(--track); }
h3 { font-size: 1.0625rem; font-weight: 600; font-family: var(--body); }
.eyebrow { font-family: var(--display); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.tiny { font-size: .8125rem; }
p { margin: 0; }
a { color: inherit; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
.who { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 3px 12px 3px 3px; min-height: 40px; background: var(--card); font-weight: 600; }
.who::after { content: "▾"; font-size: .75rem; color: var(--muted); }
.av { --ph: 3; --ps: 65%; --pl: 47%; --pld: 57%; width: 34px; height: 34px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.0625rem; line-height: 1;
  color: var(--pink, #fff); background: hsl(var(--ph) var(--ps) calc(var(--pl) * (1 - var(--dk)) + var(--pld) * var(--dk))); }
.av.lg { width: 56px; height: 56px; font-size: 1.75rem; }
.av.sm { width: 26px; height: 26px; font-size: .875rem; }
.strip { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: .8125rem; color: var(--muted); padding-bottom: 6px; min-height: 26px; }
.strip b { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }
.strip a { margin-left: auto; text-decoration: none; }
.pips { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; }
.pip { width: 9px; height: 4px; border-radius: 2px; background: var(--line); }
.pip.on { background: var(--good); }
.pip.lift.on { background: var(--accent); }
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); height: var(--nav-h); }
nav.tabs a { text-decoration: none; color: var(--muted); font-family: var(--display); font-weight: 600; font-size: 1rem; text-transform: var(--caps); letter-spacing: .06em; text-align: center; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); }
.subnav { display: flex; gap: 4px; }
.subnav a { text-decoration: none; color: var(--muted); font-size: .875rem; font-weight: 500; padding: 5px 12px; border-radius: 999px; min-height: 32px; display: inline-flex; align-items: center; }
.subnav a.on { background: var(--fg); color: var(--bg); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; gap: 12px; padding-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card.stack, .stack { display: grid; gap: 10px; }
.banner { background: var(--warn-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: .875rem; display: grid; gap: 8px; }
.banner.good { background: var(--good-soft); }
.banner.bad { background: var(--bad-soft); }
.banner.accent { background: var(--accent-soft); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
button { font: inherit; font-family: var(--body); font-weight: 500; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 12px; min-height: 40px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--display); font-size: 1.125rem; font-weight: 700; text-transform: var(--caps); letter-spacing: .05em; flex: 1; min-height: 46px; }
button.primary:disabled { background: var(--soft); color: var(--muted); border-color: var(--soft); opacity: 1; cursor: default; }
button.small { min-height: 32px; padding: 4px 10px; font-size: .8125rem; }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 6px; min-height: 32px; font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:disabled { opacity: .5; cursor: default; }
.seg { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; min-height: 34px; padding: 4px 6px; font-size: .875rem; color: var(--muted); border-radius: 7px; }
.seg button.on { background: var(--fg); color: var(--bg); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrapc { flex-wrap: wrap; overflow: visible; }
.chips button { flex: none; border-radius: 999px; min-height: 34px; padding: 4px 12px; font-size: .875rem; }
input[type=number], input[type=date], input[type=text], input[type=search], select, textarea { font: inherit; font-size: 1.0625rem; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; width: 100%; font-variant-numeric: tabular-nums; }
input[type=number] { text-align: center; -moz-appearance: textfield; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=search] { -webkit-appearance: none; appearance: none; }
input::placeholder { color: var(--muted); opacity: .6; }
.logrow input[type=number]:not(:placeholder-shown) { border-color: var(--fg); font-weight: 600; }
label.f { display: grid; gap: 3px; font-size: .6875rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; min-width: 0; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }

/* session heading */
.sess { display: grid; gap: 8px; }
.sess .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sess .head input[type=date] { width: auto; min-height: 36px; padding: 4px 8px; font-size: 1rem; } /* 16px keeps iOS from zooming the page on focus */
.datebar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.datebar button { padding: 4px 0; min-height: 46px; display: grid; gap: 1px; justify-items: center; font-weight: 500; font-size: .6875rem; color: var(--muted); border-color: transparent; background: var(--soft); border-radius: 8px; }
.datebar button b { font-family: var(--display); font-size: 1.0625rem; color: var(--fg); }
.datebar button.sel { border-color: var(--fg); background: var(--card); }
.datebar button .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.datebar button .dot.lift { background: var(--accent); }
.datebar button .dot.part { background: var(--warn); }
.datebar button .dot.cardio { background: var(--good); }
.datebar button .dot.draft { border: 2px solid var(--warn); }
.status { font-size: .8125rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* the workout sheet (lifting program) */
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0 14px; }
.blk { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.blk:first-child { border-top: 0; }
.blk .bhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.blk .bhead h3 { flex: 1; min-width: 0; }
.ex { position: relative; }
.exrx { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .875rem; color: var(--muted); }
.exlast { font-size: .875rem; color: var(--muted); }
.exlast b { color: var(--fg); font-weight: 500; }
.exhold { font-size: .8125rem; color: var(--warn); }
.logrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 6px; align-items: end; }
.logrow label.f { letter-spacing: .05em; }
.exprog { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: var(--muted); }
.exprog b { color: var(--fg); font-weight: 500; }
.exdetails { font-size: .8125rem; color: var(--muted); display: grid; gap: 4px; padding: 8px 10px; background: var(--soft); border-radius: 8px; }
.exdetails b { color: var(--fg); font-weight: 500; }
.menubtn { width: 36px; height: 32px; min-height: 32px; padding: 0; border-radius: 8px; font-size: 1.25rem; line-height: 1; letter-spacing: .05em; color: var(--muted); border-color: transparent; background: transparent; flex: none; }
.menubtn[aria-expanded="true"], .menubtn:hover { background: var(--soft); color: var(--fg); }
.menu { position: absolute; right: 0; top: 36px; z-index: 6; min-width: 230px; max-width: calc(100vw - 48px); background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; display: grid; }
.menu .mh { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 4px; font-weight: 600; }
.menu button { border: 0; background: transparent; text-align: left; border-radius: 7px; padding: 10px 10px; min-height: 42px; font-weight: 500; }
.menu button:hover, .menu button:focus-visible { background: var(--soft); outline: none; }
.menu button .sub { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; }
.menu button:disabled { opacity: .5; }
.collapsed-sum { font-size: .875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.collapsed-sum b { color: var(--fg); font-weight: 500; }
details.plain > summary { cursor: pointer; font-weight: 500; font-size: .875rem; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.plain > summary::-webkit-details-marker { display: none; }
details.plain > summary::before { content: "▸"; font-size: .75rem; }
details.plain[open] > summary::before { content: "▾"; }
details.sessopts { padding: 10px 0 2px; border-top: 1px solid var(--line); }

/* save bar */
.savebar { position: sticky; bottom: 0; z-index: 4; background: var(--bg); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; }
.savebar .note { font-size: .8125rem; color: var(--muted); }
.savebar .note.bad { color: var(--bad); font-weight: 500; }
.savebar .note.warn { color: var(--warn); }
.savebar .bar { display: flex; gap: 8px; align-items: center; }
.savebar .st { font-size: .75rem; color: var(--muted); max-width: 40%; line-height: 1.2; }

/* pick-your-own activities */
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 520px) { .acts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.act { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; text-align: left; align-items: center; padding: 10px; min-height: 64px; border-radius: calc(var(--r) * .8); }
.act .ai { grid-row: span 2; font-size: 1.5rem; line-height: 1; }
.act .an { font-weight: 600; font-size: .9375rem; line-height: 1.15; }
.act .am { font-size: .75rem; color: var(--muted); }
.act .aw { grid-column: 1 / -1; font-size: .75rem; color: var(--warn); }
.act.fav { border-color: var(--accent); }
.done-list { display: grid; }
.done-list button { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 0; min-height: 44px; }
.done-list button:first-child { border-top: 0; }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 6px; align-items: center; }
.stepper button { font-size: 1.25rem; min-height: 48px; }
.stepper input { font-size: 1.5rem; font-weight: 600; min-height: 48px; }
.weekdots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: .6875rem; color: var(--muted); }
.weekdots i { display: block; height: 8px; border-radius: 4px; background: var(--soft); margin-top: 3px; }
.weekdots .on i { background: var(--accent); }
.weekdots .rest i { background: var(--line); }
.weekdots .today { color: var(--fg); font-weight: 600; }

/* fuel */
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ringbox { position: relative; display: grid; justify-items: center; gap: 4px; }
.ring { width: 100%; max-width: 150px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.ring .rbg { stroke: var(--soft); }
.ring .rfg { stroke: var(--accent); transition: stroke-dashoffset .6s ease; }
.ring.water .rfg { stroke: var(--water); }
.ring.over .rfg { stroke: var(--warn); }
.ringtxt { position: absolute; inset: 0 0 auto 0; aspect-ratio: 1; max-width: 150px; margin: 0 auto; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ringtxt b { font-family: var(--display); font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ringtxt span { font-size: .75rem; color: var(--muted); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.macro { display: grid; gap: 3px; font-size: .8125rem; }
.macro .bar, .mini .bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.macro .bar i, .mini .bar i { display: block; height: 100%; background: var(--fg); border-radius: 3px; }
.macro b { font-variant-numeric: tabular-nums; }
.meal { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.meal:first-child { border-top: 0; }
.meal .mh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fooditem { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 0; min-height: 40px; width: 100%; }
.fooditem .fn { font-weight: 500; line-height: 1.2; }
.fooditem .fq { font-size: .8125rem; color: var(--muted); grid-column: 1; }
.fooditem .fk { grid-row: span 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.results { display: grid; }
.results .fooditem { border-top: 1px solid var(--line); border-radius: 0; padding: 9px 0; }
.results .fooditem:first-child { border-top: 0; }
.facts { border: 2px solid var(--fg); padding: 6px 10px 8px; font-family: Helvetica, Arial, sans-serif; background: var(--card); color: var(--fg); border-radius: 4px; text-align: left; font-size: .875rem; }
.facts .ft { font-weight: 900; font-size: 1.7rem; line-height: 1.05; letter-spacing: -.01em; }
.facts .srv { font-size: .8125rem; border-bottom: 8px solid var(--fg); padding-bottom: 4px; }
.facts .cal { display: flex; justify-content: space-between; align-items: flex-end; font-weight: 900; border-bottom: 4px solid var(--fg); padding: 2px 0; }
.facts .cal b { font-size: 1.9rem; line-height: 1; }
.facts .dvh { text-align: right; font-size: .75rem; font-weight: 700; padding: 2px 0; }
.facts .fr { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--muted); padding: 2px 0; }
.facts .fr.sub { padding-left: 14px; }
.facts .fr.thick { border-top: 8px solid var(--fg); }
.facts .fr b { font-weight: 700; }
.facts .fnote { border-top: 4px solid var(--fg); font-size: .6875rem; padding-top: 4px; color: var(--muted); }
.waterbtns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.waterbtns button { min-height: 36px; padding: 4px 10px; font-size: .875rem; border-radius: 999px; }

/* compete */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.vs .side { display: grid; justify-items: center; gap: 2px; }
.vs .pts { font-family: var(--display); font-size: 2.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vs .mid { font-family: var(--display); font-weight: 700; color: var(--muted); }
.race { display: grid; gap: 14px; padding: 6px 0 2px; }
.lane { --p: 0; --ph: 3; --ps: 65%; --pl: 47%; --pld: 57%; position: relative; height: 40px; border-radius: 20px; background: var(--soft); }

/* ---------- Records: normalize (content decides the kind, never the tab) ---------- */

  }

    const reps = (e.reps || []).map(r => legacy ? (isNum(r) && r > 0 ? r : null) : (isNum(r) ? r : null));

  const qualifies = kind === 'strength' && (legacy ? mainLogged >= QUALIFY_MIN : !!rec.qualifies);

  const complete = kind !== 'strength' ? null : planned ? planned.every(k => ex[k]) : null;
  const sets = sum(keys, k => ex[k].reps.filter(r => r != null).length);

    return { w: last.w, sets: fourth ? ex.sets + 1 : ex.sets, last, text: last.w + unit + (fourth ? ' · add a 4th set' : ' · ' + (top + 1) + ' reps'), why: 'Holding weight. ' + (fourth ? 'Every set is past ' + (ex.hi + 3) + '; add a set.' : 'Beat last time by one rep per set, 3-second lowering.') };

  if (d.fuel < 1) add('fuel', 'Log today\'s food and land in range', commas(g.lo) + ' to ' + commas(g.hi) + ' calories', 'fuel', c => { c.days[i].fuel = 1; });
  tips.sort((a, b) => b.gain - a.gain);

  const best = cloneFacts(f);
  best.days.forEach((x, j) => { if (j >= i) { x.active = true; if (f.plan === 'program') x.lift = true; x.minutes += 30; x.fuel = 1; x.water = 1; x.kinds.push('__k' + j); } });

/* ---------- Nutrition: daily targets, food log, food database ---------- */
const NKEYS = ['kcal', 'protein', 'fat', 'carbs', 'fiber', 'sugar', 'satfat', 'transfat', 'chol', 'sodium', 'potassium', 'calcium', 'iron', 'vitd'];
const NI = {}; NKEYS.forEach((k, i) => { NI[k] = i; });
// FDA Daily Values for adults (2,000 calorie reference diet)
const DV = { fat: 78, satfat: 20, chol: 300, sodium: 2300, carbs: 275, fiber: 28, protein: 50, vitd: 20, calcium: 1300, iron: 18, potassium: 4700 };
const MEALS = [['b', 'Breakfast'], ['l', 'Lunch'], ['d', 'Dinner'], ['s', 'Snacks']];
const MEAL_NAME = { b: 'Breakfast', l: 'Lunch', d: 'Dinner', s: 'Snacks' };
const ACTIVITY = { sed: [1.2, 'Mostly sitting'], light: [1.375, 'Lightly active, 1 to 3 days a week'], mod: [1.55, 'Active, 3 to 5 days a week'], very: [1.725, 'Very active, 6 to 7 days a week'] };
const PACE = { lose1: [-500, 'Lose about 1 lb a week'], lose05: [-250, 'Lose about ½ lb a week'], maintain: [0, 'Hold steady'], gain05: [250, 'Gain about ½ lb a week'] };

function latestWeight(pid) {
  const p = P(pid), ds = Object.keys(p.weighIns).filter(validIso).sort();
  return ds.length ? p.weighIns[ds[ds.length - 1]] : (p.body.weightLb || null);
}
// Calories: the Mifflin-St Jeor equation for resting energy, times an activity factor, adjusted for the chosen pace,
// never below 1,200 (women) / 1,500 (men). Water: the National Academies beverage guideline by sex (about 9 cups for
// women, 13 for men), raised to half of body weight in ounces when that is more, capped at a gallon.
// A number entered from a doctor always replaces the estimate.
function goalsFor(pid) {
  return cached('goals:' + pid, () => {
    const p = P(pid), b = p.body, doc = p.doctor, lb = latestWeight(pid);
    const g = { ready: false, kcalSrc: 'default', waterSrc: 'default', kcal: 2000, waterOz: 80, bmr: null, tdee: null, floor: false, lb, waterBase: null };
    const sexed = b.sex === 'm' || b.sex === 'f';
    if (sexed && b.age > 0 && b.heightIn > 0 && lb > 0) {
      const kg = lb * 0.45359237, cm = b.heightIn * 2.54;
      g.bmr = Math.round(10 * kg + 6.25 * cm - 5 * b.age + (b.sex === 'm' ? 5 : -161));
      g.tdee = Math.round(g.bmr * (ACTIVITY[b.activity] || ACTIVITY.light)[0]);
      const floor = b.sex === 'm' ? 1500 : 1200;
      let k = g.tdee + (PACE[b.pace] || PACE.maintain)[0];
      if (k < floor) { k = floor; g.floor = true; }
      g.kcal = Math.round(k / 10) * 10; g.kcalSrc = 'estimate'; g.ready = true;
    }
    if (doc.kcal > 0) { g.kcal = Math.round(doc.kcal); g.kcalSrc = 'doctor'; g.ready = true; g.floor = false; }
    if (sexed) {
      g.waterBase = b.sex === 'm' ? 104 : 72;
      const byWeight = lb > 0 ? lb * 0.5 : 0;
      g.waterOz = Math.min(128, Math.round(Math.max(g.waterBase, byWeight) / 4) * 4);
      g.waterSrc = byWeight > g.waterBase ? 'weight' : 'sex';
    }
    if (doc.waterOz > 0) { g.waterOz = Math.round(doc.waterOz); g.waterSrc = 'doctor'; }
    g.lo = Math.round(g.kcal * 0.8 / 10) * 10; g.hi = Math.round(g.kcal * 1.1 / 10) * 10;
    g.protein = lb > 0 ? Math.min(Math.round(lb * 0.7), Math.round(g.kcal * 0.35 / 4)) : Math.round(g.kcal * 0.2 / 4);
    g.fat = Math.round(g.kcal * 0.3 / 9);
    g.carbs = Math.max(0, Math.round((g.kcal - g.protein * 4 - g.fat * 9) / 4));
    return g;
  });
}

/* ---------- Day log ---------- */
const foodDay = (pid, date) => state.data[pid].food[date] || { v: 1, date, items: [], water: 0 };
function dayTotals(pid, date) {
  return cached('ft:' + pid + ':' + date, () => {
    const d = foodDay(pid, date), n = NKEYS.map(() => 0);
    (d.items || []).forEach(it => (it.n || []).forEach((v, i) => { if (isNum(v)) n[i] += v; }));
    return { n, kcal: n[0], count: (d.items || []).length, water: d.water || 0 };

}
// 1 = logged and inside the calorie range, 0.5 = a real day of logging that missed the range, 0 = little or nothing logged
function fuelUnit(pid, date) {

  const g = goalsFor(pid);

  return t.kcal >= g.kcal * 0.5 ? 0.5 : 0;
}

/* ---------- Food database (USDA FoodData Central, shipped with the page) ---------- */
const foodDb = { state: 'idle', list: null, lc: null, src: '', promise: null };
function loadFoods() {
  if (foodDb.state === 'ready' || foodDb.state === 'loading') return foodDb.promise;

    .then(j => { foodDb.list = j.f; foodDb.lc = j.f.map(f => f[0].toLowerCase()); foodDb.src = j.src || ''; foodDb.state = 'ready'; })
    .catch(() => { foodDb.state = 'error'; });

function queryTokens(q) {
  return q.toLowerCase().replace(/[^a-z0-9%' ]+/g, ' ').split(/\s+/).filter(Boolean).map(t => {
    if (t.length > 4 && /ies$/.test(t)) return t.slice(0, -3);
    if (t.length > 4 && /oes$/.test(t)) return t.slice(0, -2);
    if (t.length > 3 && /s$/.test(t) && !/ss$/.test(t)) return t.slice(0, -1);
    return t;
  });
}
function scoreName(lc, toks) { // null when a word is missing; otherwise higher is a better match (may be negative for long names)
  let score = 0;
  for (let j = 0; j < toks.length; j++) {
    const idx = lc.indexOf(toks[j]); if (idx < 0) return null;
    const startOfWord = idx === 0 || ' ,(-/'.indexOf(lc[idx - 1]) >= 0;
    score += startOfWord ? 10 : 2;
    if (idx === 0 && j === 0) score += 15;
  }
  return score - lc.length * 0.12;
}
function searchFoods(q, limit) {
  const toks = queryTokens(q); if (!toks.length) return [];
  const hits = [];
  Object.keys(state.customFoods).forEach(id => { const c = state.customFoods[id]; const s = scoreName(String(c.name || '').toLowerCase(), toks); if (s != null) hits.push({ s: s + 30, custom: id }); });
  if (foodDb.state === 'ready') {
    const lc = foodDb.lc, list = foodDb.list, plain = toks.join(' ');
    for (let i = 0; i < lc.length; i++) {
      let s = scoreName(lc[i], toks); if (s == null) continue;
      if (list[i][1] === 1) s += 3;            // foods as eaten rank a little above raw ingredients
      if (lc[i] === plain) s += 50;
      hits.push({ s, i });
    }
  }
  hits.sort((a, b) => b.s - a.s);
  return hits.slice(0, limit || 40).map(h => h.custom ? customFood(h.custom) : dbFood(h.i));
}
function dbFood(i) {
  const f = foodDb.list[i];
  const portions = (f[3] || []).map(p => ({ label: p[0], grams: p[1] })).concat([{ label: '100 g', grams: 100 }, { label: '1 oz', grams: 28.35 }, { label: '1 g', grams: 1 }]);

}

}

function amountNutrients(food, portion, qty) {

  state.status = {}; state.formError = {}; state.menu = null; state.forms = {}; state.details = {}; state.confirmRemove = null;
  applySkin(); render();
  if (state.ready) announce();
}

/* ---- 90-main.js ---- */
/* ---------- Page chrome and the render loop ---------- */
const main = $('#main');
let typing = false, pendingRender = false;
const isTextField = el => !!(el && el.matches && el.matches('input[type=number], input[type=text], input[type=search], textarea') && main.contains(el));
function stripHTML() {
  const pid = me(), t = todayIso(), ws = weekStart(t), p = P(pid), sc = weekScore(pid, ws), o = otherPid(pid), os = weekScore(o, ws);
  const pips = (n, of, cls) => '<span class="pips">' + Array.from({ length: of }, (_, i) => '<span class="pip ' + cls + (i < n ? ' on' : '') + '"></span>').join('') + '</span>';
  let h;
  if (p.plan === 'program') { const w = weekStats(t); h = '<span>Activity <b id="actCount">' + w.activity + '/' + w.goal + '</b>' + pips(w.activity, w.goal, '') + '</span><span>Lifts <b id="liftCount">' + w.lifts + '/' + LIFT_GOAL + '</b>' + pips(w.lifts, LIFT_GOAL, 'lift') + '</span>'; }
  else { const g = moveGoal(pid); h = '<span>Active days <b id="actCount">' + sc.active + '/' + g + '</b>' + pips(sc.active, g, '') + '</span><span>Minutes <b id="minCount">' + sc.minutes + '</b></span>'; }
  return h + '<a href="#compete" aria-label="Weekly score">Score <b id="myScore">' + sc.total + '</b> · ' + esc(P(o).name) + ' <b id="theirScore">' + os.total + '</b></a>';
}
function renderChrome() {
  const pid = me(), p = P(pid), t = todayIso();
  $('#todayLine').textContent = nice(t) + (p.place ? ' · ' + p.place : '');
  $('#whoBtn').innerHTML = avatarHTML(pid) + '<span>' + esc(p.name) + '</span>';
  $('#strip').innerHTML = stripHTML();
  const top = ['train', 'program', 'history'].includes(state.tab) ? 'train' : state.tab;
  document.querySelectorAll('#tabs a').forEach(a => { const on = a.dataset.tab === top; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function banners() {
  let html = '';
  if (state.storage === 'local') html += '<div class="banner">Saving in this browser only. Nothing here syncs to your account until you open the page signed in to claude.ai.</div>';
  if (state.cantWrite) html += '<div class="banner bad">This account can view the shared log but not save to it. Ask the owner to invite you as an Editor from the Share menu.</div>';
  if (state.storage === 'nodb') html += '<div class="banner bad">Your account log can\'t be reached right now. Saves may fail; lifting inputs stay on this phone as drafts.</div>';
  if (state.stale) html += '<div class="banner">Still loading your log. What you see may be out of date.</div>';
  if (state.localOnly && state.localOnly.length) html += '<div class="banner"><span>' + state.localOnly.length + ' entr' + (state.localOnly.length === 1 ? 'y' : 'ies') + ' saved in this browser ' + (state.localOnly.length === 1 ? 'is' : 'are') + ' not in your account.</span><div class="row"><button type="button" class="small" id="importBtn">Import to account</button><button type="button" class="small" id="importDismiss">Not now</button></div></div>';
  if (state.importNote) html += '<div class="banner good"><span>' + esc(state.importNote) + '</span><div class="row"><button type="button" class="small" id="importOk">OK</button></div></div>';
  return html;
}
function render(focusSel) {
  if (typing) { pendingRender = true; return; }
  pendingRender = false;
  renderChrome();
  const tab = state.tab, plan = P(me()).plan;
  let html = banners();
  if (tab === 'train' || tab === 'program' || tab === 'history') html += subnav();
  html += tab === 'train' ? (plan === 'program' ? renderTrain() : renderMove())
    : tab === 'program' ? (plan === 'program' ? renderProgram() : renderPlanChoice())
    : tab === 'history' ? renderHistory() : tab === 'fuel' ? renderFuel() : tab === 'compete' ? renderCompete() : renderMe();
  const y = window.scrollY;
  main.innerHTML = html;
  bind();
  if (focusSel) { const el = $(focusSel); if (el) el.focus({ preventScroll: true }); }
  if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y);
  if (state.scrollTo) { const el = document.getElementById(state.scrollTo); state.scrollTo = null; if (el) el.scrollIntoView({ block: 'start' }); }
}

/* ---------- Live (no re-render) updates while typing in the lifting log ---------- */
function refreshLive(date) {
  const m = model(date);
  const sl = $('#statusLine'); if (sl) sl.textContent = statusText(date);
  const sb = $('#savebar'); if (sb) { const tmp = document.createElement('div'); tmp.innerHTML = renderSaveBar(date, m, state.sessions[date]); sb.replaceWith(tmp.firstElementChild); bindSaveBar(); }
  document.querySelectorAll('.ex[data-ex]').forEach(el => {
    const key = el.dataset.ex; const ex = EX[key]; const e = m.ex[key] || { w: '', reps: [] };
    const nSets = el.querySelectorAll('[data-field="rep"]').length || setCount(key, m, date);
    const sm = exSummary(key, e, nSets);
    const prog = el.querySelector('[data-prog]');
    if (prog) { prog.hidden = !sm.loggedN; prog.innerHTML = '<span><b>' + sm.loggedN + '/' + nSets + '</b> sets logged</span>' + (sm.done ? '<button type="button" class="quiet" data-collapse="' + key + '">Collapse</button>' : ''); const cb = prog.querySelector('[data-collapse]'); if (cb) cb.addEventListener('click', onCollapse); }
    const use = el.querySelector('[data-usew]'); if (use) use.hidden = ex.bw || String(e.w) === String(use.dataset.val);
    const cs = el.querySelector('[data-sum]'); if (cs) cs.innerHTML = sm.line ? '<b>' + esc(sm.line) + '</b> · ' + sm.loggedN + '/' + nSets + ' logged' : 'Nothing logged';
  });
  document.querySelectorAll('.datebar [data-date]').forEach(b => { const dot = b.querySelector('.dot'); if (dot) dot.className = 'dot ' + dotClass(b.dataset.date, b.parentNode.dataset.mode); });
  const ca = $('#countAs'); if (ca && m.countAs == null) { const r = parseDraft(date, m); ca.checked = r.kind === 'strength' ? r.auto : false; }
}

/* ---------- Events ---------- */
main.addEventListener('input', e => {
  const el = e.target; const f = el.dataset.field; if (!f) return;
  const date = state.selDate; const d = draft(date);
  if (f === 'tmMin') d.tm.minutes = el.value;
  else if (f === 'tmTitle') d.tm.title = el.value;
  else if (f === 'notes') d.notes = el.value;
  else if (f === 'w' || f === 'rep') {
    const key = el.dataset.ex; d.ex[key] = d.ex[key] || { w: '', reps: [] };
    if (f === 'w') d.ex[key].w = el.value;
    else { const i = Number(el.dataset.i); while (d.ex[key].reps.length <= i) d.ex[key].reps.push(''); d.ex[key].reps[i] = el.value; }
  }
  d.recovered = false; delete state.formError[date]; persistDrafts(); refreshLive(date);
});
// half-filled forms (targets, name, stakes) live in state.forms so a re-render never drops what was typed
function onFormInput(e) { const el = e.target; if (!el.dataset || !el.dataset.form) return; (state.forms[el.dataset.form] = state.forms[el.dataset.form] || {})[el.dataset.k] = el.value; }
document.addEventListener('input', onFormInput);
document.addEventListener('change', onFormInput);
// while a text field in the page has focus, re-renders wait (so the keyboard and caret stay put)
main.addEventListener('focusin', e => { if (isTextField(e.target)) typing = true; });
main.addEventListener('focusout', e => {
  if (!isTextField(e.target) || isTextField(e.relatedTarget)) return;
  typing = false;
  // a waiting re-render runs after the tap that took focus away has finished, so it cannot swallow that tap
  if (pendingRender) setTimeout(() => { if (pendingRender && !typing) render(); }, 300);
});
// one click handler for every data-a action, in the page and in overlays
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  if (main.contains(el)) typing = false;
  fn(el, e);
});
// overlay fields write straight into the overlay's state
const ovRoot = $('#ov');
function onOvInput(e) {
  const el = e.target, o = state.ov; if (!o || !el.dataset || !el.dataset.ovf) return;
  const key = el.dataset.ovf, typed = e.type === 'input';
  o[key] = el.value;
  // Lists are only redrawn while typing. A field also fires "change" when it loses focus, which happens in the
  // middle of a tap on a result; redrawing then would replace the thing being tapped and swallow the tap.
  if (o.type === 'food' && key === 'q') { if (typed) { clearTimeout(foodT); foodT = setTimeout(fillFoodResults, 90); } }
  else if (o.type === 'health') { if (typed) refreshHealthPreview(); }
  else if (o.type === 'fooditem') refreshFoodItem(); // patches the label and button text in place
  else if (o.type === 'act' && key === 'min') { const b = $('#actLog'), min = Math.round(Number(el.value)); if (b) { b.disabled = !(min > 0); b.textContent = (o.id ? 'Update ' : 'Log ') + (min > 0 ? min + ' min' : ''); } }
}
ovRoot.addEventListener('input', onOvInput);
ovRoot.addEventListener('change', onOvInput);
ovRoot.addEventListener('click', e => { if (e.target === ovRoot && state.ov) { const def = OV[state.ov.type]; if (!(def.locked && def.locked(state.ov))) closeOv(); } });
document.addEventListener('change', e => { if (e.target.id === 'skinColor') { saveProfile(me(), { skin: { custom: e.target.value } }).then(() => { applySkin(); render(); }); } });
document.addEventListener('input', e => { // live preview while dragging in the color picker
  if (e.target.id !== 'skinColor') return;
  const v = skinVars({ custom: e.target.value }), st = document.documentElement.style;
  st.setProperty('--ah', v.ah); st.setProperty('--as', v.as + '%'); st.setProperty('--al', v.al + '%'); st.setProperty('--ald', v.ald + '%'); st.setProperty('--nh', v.nh); st.setProperty('--ns', v.ns + '%');
  if (v.ink) st.setProperty('--aink', v.ink); else st.removeProperty('--aink');
});
// exercise menus: close on outside tap or Escape; arrow keys move between items
document.addEventListener('click', e => { if (state.menu && !e.target.closest('.menu') && !e.target.closest('.menubtn')) { const k = state.menu.key; state.menu = null; render('[data-menu="' + k + '"]'); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.ov) { const def = OV[state.ov.type]; if (!(def.locked && def.locked(state.ov))) { closeOv(); e.preventDefault(); } return; }
  if (!state.menu) return;
  const items = Array.from(document.querySelectorAll('.menu [role="menuitem"]:not(:disabled)'));
  if (e.key === 'Escape') { const k = state.menu.key; state.menu = null; render('[data-menu="' + k + '"]'); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const i = items.indexOf(document.activeElement); const n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length; if (items[n]) items[n].focus(); e.preventDefault(); }
});
function onCollapse(ev) { const key = ev.currentTarget.dataset.collapse; const d = draft(state.selDate); d.closed[key] = true; persistDrafts(); render('[data-menu="' + key + '"]'); }
function menuAction(act, b) {
  const key = b.dataset.key; const date = state.selDate;
  if (act === 'swap') { state.menu = { key, view: 'swap' }; render('.menu [role="menuitem"]'); return; }
  if (act === 'back') { state.menu = { key, view: 'main' }; render('.menu [role="menuitem"]'); return; }
  if (act === 'swapto') { const d = draft(date); d.swaps[b.dataset.base] = b.dataset.to; d.recovered = false; state.menu = null; persistDrafts(); render('[data-menu="' + b.dataset.to + '"]'); return; }
  if (act === 'hold') { const mx = Object.assign({}, state.settings.maxed || {}); if (mx[key]) delete mx[key]; else mx[key] = true; state.menu = null; saveSettings({ maxed: mx }); const btn = document.querySelector('[data-menu="' + key + '"]'); if (btn) btn.focus({ preventScroll: true }); return; }
  if (act === 'addset') { const d = draft(date); const cur = document.querySelectorAll('[data-field="rep"][data-ex="' + key + '"]').length; d.extra[key] = Math.min(MAX_SETS, cur + 1); state.menu = null; persistDrafts(); render(); const inp = document.getElementById('r-' + key + '-' + (d.extra[key] - 1)); if (inp) inp.focus({ preventScroll: true }); return; }
  if (act === 'details') { state.details[key] = !state.details[key]; state.menu = null; render('[data-menu="' + key + '"]'); return; }
  if (act === 'collapse') { const d = draft(date); d.closed[key] = true; state.menu = null; persistDrafts(); render('[data-menu="' + key + '"]'); return; }
  if (act === 'expand') { const d = draft(date); delete d.closed[key]; state.menu = null; persistDrafts(); render('[data-menu="' + key + '"]'); return; }
}
function bind() {
  const dp = $('#datePick'); if (dp) dp.addEventListener('change', e => { const v = e.target.value; if (validIso(v) && v <= todayIso()) { state.selDate = v; state.confirmRemove = null; state.menu = null; persistDrafts(); render(); } else if (v) toast('Pick today or an earlier day.'); });
  document.querySelectorAll('[data-date]').forEach(b => b.addEventListener('click', () => { state.selDate = b.dataset.date; state.confirmRemove = null; state.menu = null; persistDrafts(); render(); }));
  document.querySelectorAll('#kindSeg [data-kind]').forEach(b => b.addEventListener('click', () => { const d = draft(state.selDate); d.kindSel = b.dataset.kind; d.recovered = false; state.menu = null; persistDrafts(); render(); }));
  document.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const key = b.dataset.menu; if (state.menu && state.menu.key === key) { state.menu = null; render('[data-menu="' + key + '"]'); } else { state.menu = { key, view: 'main' }; render('.menu [role="menuitem"]'); } }));
  document.querySelectorAll('.menu [data-act]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); menuAction(b.dataset.act, b); }));
  document.querySelectorAll('[data-gswap]').forEach(b => b.addEventListener('click', () => { const sw = Object.assign({}, state.settings.swaps || {}); if (b.dataset.to === b.dataset.gswap) delete sw[b.dataset.gswap]; else sw[b.dataset.gswap] = b.dataset.to; saveSettings({ swaps: sw }); }));
  document.querySelectorAll('[data-usew]').forEach(b => b.addEventListener('click', () => { const key = b.dataset.usew; const d = draft(state.selDate); d.ex[key] = d.ex[key] || { w: '', reps: [] }; d.ex[key].w = b.dataset.val; const inp = document.getElementById('w-' + key); if (inp) inp.value = b.dataset.val; d.recovered = false; persistDrafts(); refreshLive(state.selDate); const first = document.getElementById('r-' + key + '-0'); if (first && first.value === '') first.focus({ preventScroll: true }); }));
  document.querySelectorAll('[data-collapse]').forEach(b => b.addEventListener('click', onCollapse));
  document.querySelectorAll('[data-expand]').forEach(b => b.addEventListener('click', () => { const key = b.dataset.expand; const d = draft(state.selDate); delete d.closed[key]; persistDrafts(); render('[data-menu="' + key + '"]'); }));
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => { state.selDate = b.dataset.edit; state.confirmRemove = null; persistDrafts(); location.hash = 'train'; if (state.tab === 'train') render(); }));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => { const d = b.dataset.remove; if (state.confirmRemove === d) removeRecord(d); else { state.confirmRemove = d; render(); const det = document.querySelector('details[data-hdate="' + d + '"]'); if (det) det.open = true; } }));
  bindSaveBar();
  const goal = $('#goalIn'); if (goal) goal.addEventListener('change', e => { const v = Math.max(3, Math.min(7, Number(e.target.value) || GOAL)); typing = false; saveSettings({ goal: v }).then(settle); });
  const form = $('#logForm'); if (form) form.addEventListener('submit', e => { e.preventDefault(); save(); });
  const ca = $('#countAs'); if (ca) ca.addEventListener('change', () => { const d = draft(state.selDate); d.countAs = ca.checked; persistDrafts(); refreshLive(state.selDate); });
  const dd = $('#discardDraft'); if (dd) dd.addEventListener('click', () => { delete state.drafts[state.selDate]; delete state.formError[state.selDate]; persistDrafts(); render(); toast('Draft discarded'); });
  const eh = $('#exHist'); if (eh) eh.addEventListener('change', e => { state.exHist = e.target.value; render(); });
  const ib = $('#importBtn'); if (ib) ib.addEventListener('click', importLocal);
  const idm = $('#importDismiss'); if (idm) idm.addEventListener('click', () => { state.localOnly = null; render(); });
  const iok = $('#importOk'); if (iok) iok.addEventListener('click', () => { state.importNote = null; render(); });
}
function bindSaveBar() {
  const sb = $('#saveBtn'); if (sb) sb.addEventListener('click', save);
  const del = $('#delBtn'); if (del) del.addEventListener('click', () => { if (state.confirmRemove === state.selDate) removeRecord(state.selDate); else { state.confirmRemove = state.selDate; refreshLive(state.selDate); } });
}
function save() {
  const date = state.selDate;
  if (date > todayIso()) { toast('Future dates can\'t be saved as activity.'); return; }
  const m = model(date); const r = parseDraft(date, m);
  if (r.errors.length) {
    state.formError[date] = r.errors[0]; refreshLive(date); toast(r.errors[0], 3200);
    const k = Object.keys(EX).find(k => r.errors[0].startsWith(EX[k].name)); const inp = k ? document.getElementById('w-' + k) : null; if (inp) inp.focus(); return;
  }
  delete state.formError[date]; state.menu = null; typing = false;
  const note = saveNote(date, m);
  saveRecord(date, r.doc).then(() => {
    const st = state.status[date];
    if (st && st.s === 'failed') { toast('Save failed. Your inputs are kept; tap Retry.', 3200); return; }
    const msg = r.kind === 'cardio' && r.fromLift ? r.doc.treadmill.minutes + ' treadmill minutes saved. No lifting sets recorded; ' + DAYS[nextDayKey(date)].name + ' remains next.'
      : r.kind === 'strength' ? (note ? note.text : DAYS[r.doc.day].name + ' day saved · counts as lift day · next: ' + DAYS[ROTATION[(ROTATION.indexOf(r.doc.day) + 1) % 3]].name)
      : r.kind === 'rest' ? 'Rest day saved.' : 'Treadmill saved.';
    celebrate(msg + (st && st.s === 'synced' ? ' Synced.' : st && st.s === 'local' ? ' Saved in this browser.' : ''), { ms: 3800 });
  });
  if (!state.settings.startDate) saveSettings({ startDate: date < todayIso() ? date : todayIso() });
}

/* ---------- Routing and boot ---------- */
const TABS = ['train', 'program', 'history', 'fuel', 'compete', 'me'];
function route() {
  const h = (location.hash || '#train').slice(1), tab = TABS.includes(h) ? h : 'train', changed = tab !== state.tab;
  state.tab = tab; state.confirmRemove = null; state.menu = null; typing = false;
  const jump = state.scrollTo;
  render();
  if (changed && !jump) window.scrollTo(0, 0);
}
window.MorningLaps = { state, P, weekScore, coach, goalsFor, badgesFor, searchFoods, loadFoods, dayTotals, compWeeks, parseHealthPaste, foodCount: () => foodDb.list ? foodDb.list.length : 0 };
(function boot() {
  const saved = lsGet('ml.me', null);
  state.pid = PIDS.includes(saved) ? saved : null;
  applySkin();
  window.addEventListener('hashchange', route);
  route();
  if (!state.pid) openOv({ type: 'who', first: true });
  connect();
})();

})();
